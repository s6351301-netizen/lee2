<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>車牌辨識系統</title>
    <!-- 引入 Tesseract.js -->
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; text-align: center; padding: 20px; background-color: #f4f4f9; }
        #camera-view { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: #000; z-index: 1000; }
        #video { width: 100%; height: 75%; object-fit: cover; }
        .controls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: center; gap: 15px; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; border-radius: 50px; border: none; color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

    <div id="main-panel">
        <h2>車牌自動辨識系統</h2>
        <p>點擊下方按鈕開始辨識</p>
        <button onclick="openCamera()" style="background:#4CAF50;">📸 啟動鏡頭</button>
    </div>

    <div id="camera-view">
        <video id="video" autoplay playsinline></video>
        <div class="controls">
            <button onclick="processImage()" style="background:#2196F3;">確認拍照</button>
            <button onclick="closeCamera()" style="background:#f44336;">關閉</button>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyxGlW0JvB8itdSztrM99wdlDegrOoV3piCHmvrop58p0qMqkHGp91yLyaq8a0Ke3fW/exec";

        async function openCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                document.getElementById('video').srcObject = stream;
                document.getElementById('camera-view').style.display = 'block';
            } catch (err) {
                alert("無法存取相機，請確認已授權權限：" + err);
            }
        }

        function closeCamera() {
            const video = document.getElementById('video');
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
            document.getElementById('camera-view').style.display = 'none';
        }

        async function processImage() {
            const video = document.getElementById('video');
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            
            alert("正在進行離線車牌辨識，請稍候...");

            // 1. 使用 Tesseract.js 進行 OCR
            const { data: { text } } = await Tesseract.recognize(canvas, 'eng'); // 車牌通常是英文數字
            const plateResult = text.trim();
            
            console.log("辨識結果:", plateResult);
            alert("辨識到文字: " + plateResult + "\n準備上傳...");

            // 2. 上傳到 Google 試算表
            fetch(GAS_URL, {
                method: 'POST',
                mode: 'no-cors', // 解決簡單跨域問題
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ plate: plateResult })
            })
            .then(() => {
                alert("✅ 已成功上傳: " + plateResult);
                closeCamera();
            })
            .catch(err => {
                alert("❌ 上傳失敗: " + err);
            });
        }
    </script>
</body>
</html>
