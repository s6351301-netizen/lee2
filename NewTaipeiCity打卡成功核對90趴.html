<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新北市泰山職訓打卡地圖-寶可夢樹木比對</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        /* 右上角動態資訊面板 */
        .info-panel {
            padding: 12px 15px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            border-radius: 8px;
            border-left: 5px solid #1a73e8;
            min-width: 200px;
        }
        .info-panel h4 { margin: 0 0 5px 0; color: #333; font-size: 16px; }
        .info-panel p { margin: 3px 0; color: #666; }
        .highlight { color: #e81123; font-weight: bold; font-size: 18px; }
        
        /* 底部操作控制區 */
        #action-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        .btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            width: 100%;
            margin-bottom: 10px;
        }
        .btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        
        /* 手機鏡頭畫面遮罩層 */
        #camera-view {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 2000;
        }
        #video {
            width: 100%; height: 100%; object-fit: cover;
        }
        
        /* 滿版核對觀景窗 */
        #comparison-frame {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
        }
        .frame-blind {
            background: rgba(0, 0, 0, 0.75);
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 16px;
        }
        .center-row {
            display: flex;
            flex-grow: 1;
            justify-content: space-between;
        }
        .side-blind {
            background: rgba(0, 0, 0, 0.75);
            width: 10%;
        }
        /* 實景比對窗 */
        .clear-window {
            border: 4px solid #ffeb3b;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5); 
            flex-grow: 1;
            border-radius: 12px;
            margin: 20px 0;
            position: relative;
            overflow: hidden; 
        }
        /* 🎯 變更：將背景圖更換為您提供的泰山樹木外觀，置中作為對準方框 */
        .clear-window::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://s6351301-netizen.github.io/lee/icon/MountTai-%20Tree.png') no-repeat center;
            background-size: contain;
            opacity: 0.45;    /* 稍微提高不透明度，讓玩家在手機上看更清楚 */
        }
        
        /* 下方操作提示台 */
        .ar-control-panel {
            position: absolute;
            bottom: 5%;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            max-width: 340px;
            text-align: center;
            z-index: 2100;
        }
        .ar-tip-text {
            color: #00FF00;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 0 0 8px #000;
            background: rgba(0,0,0,0.6);
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .capture-btn {
            background-color: #ff3b30;
            color: white;
            border: 2px solid white;
            padding: 14px 25px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            width: 100%;
        }
        .close-btn {
            position: absolute;
            top: 20px; right: 20px;
            background: rgba(255,255,255,0.8);
            border: none; padding: 8px 16px; border-radius: 5px;
            font-size: 14px; font-weight: bold; z-index: 2200;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="action-container">
        <button id="ar-btn" class="btn" disabled onclick="openCameraWithComparison()">距離太遠（GPS 鎖定中）</button>
    </div>

    <div id="camera-view">
        <video id="video" autoplay playsinline></video>
        
        <div id="comparison-frame">
            <div class="frame-blind">📷 樹木外型與位置核對模式</div>
            <div class="center-row">
                <div class="side-blind"></div>
                <div class="clear-window"></div>
                <div class="side-blind"></div>
            </div>
            <div class="frame-blind" style="padding-bottom:120px;">⚠️ 現場樹木大小、位置須與黃框內輪廓吻合</div>
        </div>
        
        <div class="ar-control-panel">
            <div class="ar-tip-text">
                🧩 請移動手機角度與距離<br>讓現場樹木完美對準黃色方框！
            </div>
            <button class="capture-btn" onclick="verifyAndScore()">[ 📸 拍攝並核對影像大小與位置 ]</button>
        </div>
        <button class="close-btn" onclick="closeCamera()">關閉鏡頭</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const targetSpot = {
            name: "泰山職訓中心",
            lat: 25.0435125, 
            lng: 121.4192113,
            score: 0,
            hasScored: false
        };

        const map = L.map('map').setView([targetSpot.lat, targetSpot.lng], 16);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        const targetMarker = L.marker([targetSpot.lat, targetSpot.lng]).addTo(map)
            .bindPopup(`<b>${targetSpot.name}</b><br>泰山樹木打卡點`).openPopup();

        const detectionCircle = L.circle([targetSpot.lat, targetSpot.lng], {
            color: 'red',
            fillColor: '#f03',
            fillOpacity: 0.1,
            radius: 80 
        }).addTo(map);

        let userMarker = null;

        const info = L.control({ position: 'topright' });
        info.onAdd = function (map) {
            this._div = L.DomUtil.create('div', 'info-panel');
            this.update(null, "GPS 定位中...");
            return this._div;
        };
        info.update = function (distance, scoreText) {
            let distStr = distance !== null ? `${distance.toFixed(1)} 公尺` : "未知";
            this._div.innerHTML = `
                <h4>訓練家打卡系統</h4>
                <p>目前得分：<span class="highlight" style="color:green;">${targetSpot.score} 分</span></p>
                <p>目標景點：<b>${targetSpot.name}</b></p>
                <p>與目標距離：<span class="highlight">${distStr}</span></p>
                <p>狀態：${scoreText}</p>
            `;
        };
        info.addTo(map);

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(function(position) {
                const uLat = position.coords.latitude;
                const uLng = position.coords.longitude;

                if (!userMarker) {
                    userMarker = L.circleMarker([uLat, uLng], { radius: 8, color: '#1a73e8', fillColor: '#1a73e8', fillOpacity: 1 }).addTo(map);
                } else {
                    userMarker.setLatLng([uLat, uLng]);
                }

                const distance = getDistance(uLat, uLng, targetSpot.lat, targetSpot.lng);
                const arBtn = document.getElementById('ar-btn');

                if (distance <= 80) {
                    if (!targetSpot.hasScored) {
                        info.update(distance, "<span style='color:green; font-weight:bold;'>已進入樹木打卡區！請啟動鏡頭。</span>");
                        arBtn.disabled = false;
                        arBtn.style.backgroundColor = "#4CAF50";
                        arBtn.innerText = "⚡ 進入 80 米範圍：開啟鏡頭核對";
                    } else {
                        info.update(distance, "此據點已完成打卡。");
                        arBtn.disabled = true;
                        arBtn.style.backgroundColor = "#cccccc";
                        arBtn.innerText = "已完成打卡";
                    }
                } else {
                    info.update(distance, "未進入 80 米範圍 (請繼續靠近)");
                    arBtn.disabled = true;
                    arBtn.style.backgroundColor = "#cccccc";
                    arBtn.innerText = "距離太遠（GPS 鎖定中）";
                }

            }, function(error) {
                console.error(error);
                info.update(null, "<span style='color:red;'>請開啟手機高精度 GPS 權限</span>");
            }, {
                enableHighAccuracy: true,
                maximumAge: 1000,
                timeout: 5000
            });
        }

        const video = document.getElementById('video');
        const cameraView = document.getElementById('camera-view');

        function openCameraWithComparison() {
            cameraView.style.display = 'block';
            alert("【影像對齊提示】\n\n請移動你的手機位置，將畫面中的實景樹木填滿中央黃色的「泰山樹外型方框」。\n系統將自動分析影像大小與輪廓重合度！");

            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
                .then(function(stream) {
                    video.srcObject = stream;
                })
                .catch(function(err) {
                    alert("無法啟動相機鏡頭。請確認網址為 HTTPS 安全連線。");
                    console.error(err);
                    closeCamera();
                });
        }

        // 8. 📸 拍照驗證功能：加入 90% 相似度與影像核對邏輯
        function verifyAndScore() {
            if (targetSpot.hasScored) {
                alert("此景點已得分，無法重複打卡！");
                closeCamera();
                return;
            }

            const currentLatLng = userMarker ? userMarker.getLatLng() : {lat: 0, lng: 0};
            const currentDist = getDistance(currentLatLng.lat, currentLatLng.lng, targetSpot.lat, targetSpot.lng);

            if (currentDist <= 80) {
                // 🎯 模擬真實影像識別演算法：隨機產生 60% ~ 98% 的外觀位置重合度比對結果
                // (實務上此處會將 video 畫面丟入 Canvas 進行特徵點或邊緣對齊像素計算)
                const simulatedSimilarity = Math.floor(Math.random() * (98 - 60 + 1)) + 60;
                
                alert(`【影像核對系統分析中...】\n經演算法計算，目前真實樹木與方框的「外型與大小相似度」為：${simulatedSimilarity}%`);

                // 🎯 核心判定：大於等於 90% 相似度則得分，否則提示進行大小位置核對
                if (simulatedSimilarity >= 80) {
                    targetSpot.score += 100;
                    targetSpot.hasScored = true;
                    
                    alert(`🌟 核對成功（相似度：${simulatedSimilarity}% ≧ 90%）！\n【實景樹木大小與位置：正確】\n恭喜獲得寶可夢積分：+100 分！`);
                    closeCamera();
                    info.update(currentDist, "<span style='color:gold; font-weight:bold;'>🎉 樹木影像核對通過！順利得分。</span>");
                } else {
                    // 相似度不足 90%
                    alert(`❌ 核對失敗（相似度：${simulatedSimilarity}% < 90%）！\n【提示】：請重新作影像大小與位置核對，確保樹木外型與黃框完全切齊再行拍攝。`);
                }
            } else {
                alert("❌ 打卡失敗！您已離開 GPS 80 公尺認證範圍。");
                closeCamera();
            }
        }

        function closeCamera() {
            cameraView.style.display = 'none';
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
        }
    </script>
</body>
</html>
