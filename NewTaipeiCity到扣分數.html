<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新北市泰山職訓打卡地圖-寶可夢</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        /* 右上角動態資訊面板 */
        .info-panel {
            padding: 12px 15px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            border-radius: 8px;
            border-left: 5px solid #1a73e8;
            min-width: 200px;
        }
        .info-panel h4 { margin: 0 0 5px 0; color: #333; font-size: 16px; }
        .info-panel p { margin: 3px 0; color: #666; }
        .highlight { color: #e81123; font-weight: bold; font-size: 18px; }
        
        /* 底部操作控制區 */
        #action-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        .btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            width: 100%;
            margin-bottom: 10px;
        }
        .btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .btn-history { background-color: #2196F3; }
        
        /* 手機鏡頭畫面遮罩層 */
        #camera-view {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 2000;
        }
        #video {
            width: 100%; height: 100%; object-fit: cover;
        }
        
        /* 滿版核對觀景窗 */
        #comparison-frame {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
        }
        .frame-blind {
            background: rgba(0, 0, 0, 0.75);
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 16px;
        }
        .center-row {
            display: flex;
            flex-grow: 1;
            justify-content: space-between;
        }
        .side-blind {
            background: rgba(0, 0, 0, 0.75);
            width: 10%;
        }
        /* 實景比對窗 */
        .clear-window {
            border: 4px solid #ffeb3b;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5); 
            flex-grow: 1;
            border-radius: 12px;
            margin: 20px 0;
            position: relative;
            overflow: hidden; 
        }
        .clear-window::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 105%; height: 105%;
            background: url('icon/MountTai-Tree.png') no-repeat center;
            background-size: contain;
            opacity: 0.35;    
        }
        
        /* 下方操作提示台 */
        .ar-control-panel {
            position: absolute;
            bottom: 5%;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            max-width: 340px;
            text-align: center;
            z-index: 2100;
        }
        .ar-tip-text {
            color: #00FF00;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 0 0 8px #000;
            background: rgba(0,0,0,0.6);
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .capture-btn {
            background-color: #ff3b30;
            color: white;
            border: 2px solid white;
            padding: 14px 25px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            width: 100%;
        }
        .close-btn {
            position: absolute;
            top: 20px; right: 20px;
            background: rgba(255,255,255,0.8);
            border: none; padding: 8px 16px; border-radius: 5px;
            font-size: 14px; font-weight: bold; z-index: 2200;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="action-container">
        <button id="ar-btn" class="btn" disabled onclick="openCameraWithComparison()">距離太遠（GPS 鎖定中）</button>
        <button class="btn btn-history" onclick="viewHistory()">查看歷史數據</button>
    </div>

    <div id="camera-view">
        <video id="video" autoplay playsinline></video>
        
        <div id="comparison-frame">
            <div class="frame-blind">📷 實景照片核對模式</div>
            <div class="center-row">
                <div class="side-blind"></div>
                <div class="clear-window"></div>
                <div class="side-blind"></div>
            </div>
            <div class="frame-blind" style="padding-bottom:120px;">⚠️ 畫面外觀若與照片不符則不計分</div>
        </div>
        
        <div class="ar-control-panel">
            <div class="ar-tip-text">
                🧩 請將手機移動，讓現場樹木景物<br>完美契合畫面中央的輪廓照片！
            </div>
            <button class="capture-btn" onclick="verifyAndScore()">[ 📸 拍照確認：確認外型無誤 ]</button>
        </div>
        <button class="close-btn" onclick="closeCamera()">關閉鏡頭</button>
    </div>

    <canvas id="hidden-canvas" style="display: none;"></canvas>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const targetSpot = {
            name: "泰山職訓中心",
            lat: 25.0435125, 
            lng: 121.4192113,
            score: 0,
            hasScored: false
        };

        function saveScoreToHistory(score) {
            const history = JSON.parse(localStorage.getItem('gameHistory') || '[]');
            history.push({
                date: new Date().toLocaleString(),
                score: score
            });
            localStorage.setItem('gameHistory', JSON.stringify(history));
        }

        function viewHistory() {
            const history = JSON.parse(localStorage.getItem('gameHistory') || '[]');
            if (history.length === 0) {
                alert("目前尚無遊戲歷史紀錄。");
            } else {
                let report = "【打卡歷史紀錄】\n\n";
                history.forEach((entry, index) => {
                    report += `${index + 1}. ${entry.date} | 得分: +${entry.score}\n`;
                });
                alert(report);
            }
        }

        const map = L.map('map').setView([targetSpot.lat, targetSpot.lng], 16);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        const targetMarker = L.marker([targetSpot.lat, targetSpot.lng]).addTo(map)
            .bindPopup(`<b>${targetSpot.name}</b><br>寶可夢據點`).openPopup();

        const detectionCircle = L.circle([targetSpot.lat, targetSpot.lng], {
            color: 'red',
            fillColor: '#f03',
            fillOpacity: 0.1,
            radius: 80 
        }).addTo(map);

        let userMarker = null;

        const info = L.control({ position: 'topright' });
        info.onAdd = function (map) {
            this._div = L.DomUtil.create('div', 'info-panel');
            this.update(null, "GPS 定位中...");
            return this._div;
        };
        info.update = function (distance, scoreText) {
            let distStr = distance !== null ? `${distance.toFixed(1)} 公尺` : "未知";
            this._div.innerHTML = `
                <h4>訓練家打卡系統</h4>
                <p>目前得分：<span class="highlight" style="color:green;">${targetSpot.score} 分</span></p>
                <p>目標景點：<b>${targetSpot.name}</b></p>
                <p>與目標距離：<span class="highlight">${distStr}</span></p>
                <p>狀態：${scoreText}</p>
            `;
        };
        info.addTo(map);

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(function(position) {
                const uLat = position.coords.latitude;
                const uLng = position.coords.longitude;

                if (!userMarker) {
                    userMarker = L.circleMarker([uLat, uLng], { radius: 8, color: '#1a73e8', fillColor: '#1a73e8', fillOpacity: 1 }).addTo(map);
                } else {
                    userMarker.setLatLng([uLat, uLng]);
                }

                const distance = getDistance(uLat, uLng, targetSpot.lat, targetSpot.lng);
                const arBtn = document.getElementById('ar-btn');

                if (distance <= 80) {
                    if (!targetSpot.hasScored) {
                        info.update(distance, "<span style='color:green; font-weight:bold;'>已進入 80 米打卡區！請啟動鏡頭。</span>");
                        arBtn.disabled = false;
                        arBtn.style.backgroundColor = "#4CAF50";
                        arBtn.innerText = "⚡ 進入 80 米範圍：開啟鏡頭核對";
                    } else {
                        info.update(distance, "此據點已完成打卡。");
                        arBtn.disabled = true;
                        arBtn.style.backgroundColor = "#cccccc";
                        arBtn.innerText = "已完成打卡";
                    }
                } else {
                    info.update(distance, "未進入 80 米範圍 (請繼續靠近)");
                    arBtn.disabled = true;
                    arBtn.style.backgroundColor = "#cccccc";
                    arBtn.innerText = "距離太遠（GPS 鎖定中）";
                }

            }, function(error) {
                console.error(error);
                info.update(null, "<span style='color:red;'>請開啟手機高精度 GPS 權限</span>");
            }, {
                enableHighAccuracy: true,
                maximumAge: 1000,
                timeout: 5000
            });
        }

        const video = document.getElementById('video');
        const cameraView = document.getElementById('camera-view');

        function openCameraWithComparison() {
            cameraView.style.display = 'block';
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
                .then(function(stream) {
                    video.srcObject = stream;
                })
                .catch(function(err) {
                    alert("無法啟動相機鏡頭。");
                    closeCamera();
                });
        }

        // 🎯 升級版：具備中央裁剪與紙張防禦機制的精確度分析引擎
        function verifyAndScore() {
            if (targetSpot.hasScored) {
                alert("此景點已得分，無法重複打卡！");
                closeCamera();
                return;
            }

            const currentLatLng = userMarker ? userMarker.getLatLng() : {lat: 0, lng: 0};
            const currentDist = getDistance(currentLatLng.lat, currentLatLng.lng, targetSpot.lat, targetSpot.lng);

            if (currentDist <= 80) {
                const canvas = document.getElementById('hidden-canvas');
                const ctx = canvas.getContext('2d');
                
                // 1. 取得真實視訊影片的解析度
                const vW = video.videoWidth;
                const vH = video.videoHeight;
                
                // 2. 🎯 精準控制：計算中央黃框在實際視訊中的座標與大小（只抓中央 50% 區域，排除四周背景干擾）
                const cropW = vW * 0.5;
                const cropH = vH * 0.5;
                const cropX = (vW - cropW) / 2;
                const cropY = (vH - cropH) / 2;

                canvas.width = 100;
                canvas.height = 100;
                
                // 🎯 僅將中央黃框內的影像渲染至 Canvas 進行分析
                ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, canvas.width, canvas.height);
                const frameData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

                let greenPoints = 0;
                let paperOrWhitePoints = 0;
                const totalPixels = canvas.width * canvas.height;

                // 3. 🎯 嚴格的防偽與特徵比對迴圈
                for (let i = 0; i < frameData.length; i += 4) {
                    const r = frameData[i];
                    const g = frameData[i+1];
                    const b = frameData[i+2];

                    // 檢查是否為紙張/無彩色系（R、G、B 非常接近，差值在 15 以內）
                    const isMonochrome = Math.abs(r - g) < 15 && Math.abs(g - b) < 15 && Math.abs(r - b) < 15;
                    
                    // 嚴格定義植物的「真實葉綠素色調」：綠色必須顯著大於紅藍，且不能是灰白紙張
                    const isRealTreeGreen = (g > r * 1.25) && (g > b * 1.15) && (g > 35) && !isMonochrome;

                    if (isRealTreeGreen) {
                        greenPoints++;
                    }
                    if (isMonochrome && (r > 150)) {
                        paperOrWhitePoints++; // 紀錄疑似紙張或死白物件的像素點
                    }
                }

                // 4. 🎯 相似度與位置、大小複合運算公式
                const greenRatio = greenPoints / totalPixels; 
                const paperRatio = paperOrWhitePoints / totalPixels; 

                // 換算精確度分數（設定黃框中央必須有 30% 面積覆蓋為正確的樹葉分佈區）
                let precisionScore = Math.round((greenRatio / 0.30) * 100);
                
                // 如果畫面中央有超過 40% 的面積被偵測出是無彩色的紙張/牆壁，實施倒扣懲罰
                if (paperRatio > 0.40) { 
                    precisionScore -= Math.round((paperRatio * 60)); 
                }
                precisionScore = Math.max(0, Math.min(100, precisionScore));

                // 5. 檢核條件判定
                if (precisionScore >= 80) {
                    targetSpot.score += 100;
                    targetSpot.hasScored = true;
                    
                    saveScoreToHistory(100);
                    
                    alert(`🌟 核對成功！\n經精確影像核對，樹木相似度達標：${precisionScore}%\n恭喜獲得寶可夢積分：+100 分！`);
                    closeCamera();
                    info.update(currentDist, "<span style='color:gold; font-weight:bold;'>🎉 任務完成！順利得分。</span>");
                } else {
                    // 低於 80% 門檻時拒絕得分，強制退回核對
                    alert(`❌ 核對失敗（目前核對精確度：${precisionScore}%）\n\n【原因判定】：偵測到畫面多為紙張、白牆或非植物色彩。\n請務必移動手機，重新作影像大小與位置核對！`);
                }
            } else {
                alert("❌ 打卡失敗！您已離開 80 公尺範圍。");
                closeCamera();
            }
        }

        function closeCamera() {
            cameraView.style.display = 'none';
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
        }
    </script>
</body>
</html>
