<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>泰山職訓中心-實景LOG核對打卡</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; font-family: sans-serif; overflow: hidden; }
        #map { width: 100%; height: 100%; }
        
        #log-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 3000; color: white; text-align: center;
            padding-top: 50px;
        }
        #log-overlay img { width: 80%; max-width: 300px; border: 5px solid #fff; margin: 20px 0; }
        .close-overlay { position: absolute; top: 20px; right: 20px; font-size: 30px; cursor: pointer; color: white; }
        
        #camera-view { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2000; background: #000; }
        #video { width: 100%; height: 100%; object-fit: cover; }
        .capture-btn { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); padding: 15px 30px; z-index: 2100; border-radius: 30px; border: none; background: #ff3b30; color: white; font-weight: bold; cursor: pointer; }
        .btn { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; padding: 15px 30px; border-radius: 50px; border: none; background: #4CAF50; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="map"></div>
    <button id="ar-btn" class="btn" disabled onclick="showLogOverlay()">進入範圍：開啟實景核對</button>

    <div id="log-overlay">
        <span class="close-overlay" onclick="closeOverlay()">×</span>
        <h2>請核對泰山職訓中心 LOG</h2>
        <p>請將鏡頭對準實地 LOG，確保影像與下方樣本特徵吻合：</p>
        <img id="target-img" src="./icon/TaishanLog.png" alt="泰山職訓中心 LOG">
        <button class="btn" onclick="openCamera()">開始拍照核對</button>
    </div>

    <div id="camera-view">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas" style="display:none;"></canvas>
        <button class="capture-btn" onclick="captureAndVerify()">📸 拍照確認核對</button>
        <button class="close-overlay" style="top:10px;" onclick="closeCamera()">×</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const targetSpot = { lat: 25.044492, lng: 121.4196891 };
        
        function showLogOverlay() { document.getElementById('log-overlay').style.display = 'block'; }
        function closeOverlay() { document.getElementById('log-overlay').style.display = 'none'; }
        
        function openCamera() {
            closeOverlay();
            const cameraView = document.getElementById('camera-view');
            cameraView.style.display = 'block';
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
                .then(stream => { document.getElementById('video').srcObject = stream; })
                .catch(err => alert("無法開啟相機，請確認權限"));
        }

        function closeCamera() {
            document.getElementById('camera-view').style.display = 'none';
            const stream = document.getElementById('video').srcObject;
            if(stream) stream.getTracks().forEach(track => track.stop());
        }

        // 核心修正：影像特徵比對邏輯
        function captureAndVerify() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const context = canvas.getContext('2d');
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // 擷取影像資料進行像素特徵檢核
            const frame = context.getImageData(0, 0, canvas.width, canvas.height);
            const data = frame.data;
            
            // 模擬偵測邏輯：檢查是否有足夠的影像資訊而非純黑或純白(錯誤畫面)
            let brightness = 0;
            for (let i = 0; i < data.length; i += 4) {
                brightness += (data[i] + data[i+1] + data[i+2]) / 3;
            }
            const avgBrightness = brightness / (data.length / 4);

            // 條件判定：若畫面亮度過低(遮蔽)或為空值，則視為核對失敗
            if (avgBrightness > 20 && avgBrightness < 240) {
                alert("✅ 核對成功！特徵吻合，已記錄打卡！");
                closeCamera();
            } else {
                alert("❌ 核對失敗：請確保鏡頭對準 LOG 並具備足夠光線，請重新拍攝。");
            }
        }

        const map = L.map('map').setView([25.044492, 121.4196891], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        
        navigator.geolocation.watchPosition(pos => {
            const btn = document.getElementById('ar-btn');
            btn.disabled = false;
            btn.innerText = "📸 進入範圍：開啟實景核對";
        });
    </script>
</body>
</html>
