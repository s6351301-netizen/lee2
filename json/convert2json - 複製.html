<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>極致完美！CSV/TSV → 標準 JSON 轉換器</title>
  <style>
    :root {
      --bg-color: #0e1118;
      --card-bg: #161b22;
      --text-color: #c9d1d9;
      --primary: #238636;
      --primary-hover: #2ea043;
      --accent: #58a6ff;
      --border-color: #30363d;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 1500px;
    }

    h2 {
      color: #fff;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    @media (min-width: 768px) {
      .grid { grid-template-columns: 1fr 1fr; }
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 15px;
      display: flex;
      flex-direction: column;
    }

    .panel-title {
      font-size: 1.1em;
      font-weight: bold;
      margin-bottom: 10px;
      color: var(--accent);
    }

    textarea {
      width: 100%;
      height: 450px;
      background-color: #0d1117;
      color: #edf2f7;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px;
      box-sizing: border-box;
      font-family: "Courier New", Courier, monospace;
      font-size: 14px;
      line-height: 1.5;
      resize: vertical;
    }

    pre {
      width: 100%;
      height: 450px;
      background-color: #0d1117;
      color: #39d353;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px;
      box-sizing: border-box;
      font-family: "Courier New", Courier, monospace;
      font-size: 14px;
      overflow: auto;
      margin: 0;
      white-space: pre;
    }

    .btn-group {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background-color: var(--primary-hover); }
    button.secondary { background-color: #21262d; border: 1px solid var(--border-color); color: var(--text-color); }
    button.secondary:hover { background-color: #30363d; }

    .hint {
      font-size: 0.85em;
      color: #8b949e;
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>CSV / TSV ➜ 標準智慧型 JSON 轉換器</h2>
    <p class="hint">💡 智慧型功能：自動識別數字/布林值型態、完美支援欄位內含逗號、自動校正拼錯的 passwor 欄位。</p>
    
    <div class="grid">
      <div class="panel">
        <div class="panel-title">📥 請貼上 Excel / CSV / TSV 原始資料</div>
        <textarea id="inputText" placeholder="第一行必須為欄位名稱。支援：&#10;1. 直接從 Excel 複製貼上 (Tab分隔)&#10;2. 標準 CSV (逗號分隔)"></textarea>
        <div class="btn-group">
          <button onclick="convertToJSON()">轉換成 JSON</button>
          <button class="secondary" onclick="clearAll()">清空內容</button>
        </div>
      </div>
      
      <div class="panel">
        <div class="panel-title">📤 完美的 JSON 轉換結果</div>
        <pre id="output">// 轉換後的標準 JSON 將顯示於此</pre>
        <div class="btn-group">
          <button class="secondary" onclick="copyToClipboard()">複製到剪貼簿</button>
          <button class="secondary" onclick="downloadJSON()">下載 .json 檔案</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let jsonData = [];

    // 精準的 CSV/TSV 一行解析器（完美處理包含引號、逗號或 Tab 的複雜文字）
    function parseLine(line, delimiter) {
      const result = [];
      let current = '';
      let inQuotes = false;

      for (let i = 0; i < line.length; i++) {
        const char = line[i];

        if (char === '"') {
          inQuotes = !inQuotes; // 切換雙引號狀態
        } else if (char === delimiter && !inQuotes) {
          result.push(current.trim().replace(/^"|"$/g, '')); // 移除首尾雙引號
          current = '';
        } else {
          current += char;
        }
      }
      result.push(current.trim().replace(/^"|"$/g, ''));
      return result;
    }

    // 將數值、布林自動還原成正確的 JSON 型態
    function smartTypeCast(value) {
      if (value === "") return "";
      // 識別布林值
      if (value.toLowerCase() === "true") return true;
      if (value.toLowerCase() === "false") return false;
      // 識別數字 (排除包含斜線的日期如 1978/12/5)
      if (!isNaN(value) && !value.includes('/') && !value.includes('-')) {
        return Number(value);
      }
      return value;
    }

    // 主轉換邏輯
    function convertToJSON() {
      const text = document.getElementById("inputText").value.trim();
      if (!text) {
        alert("請先貼上 CSV、TSV 或文字！");
        return;
      }

      // 1. 分割行，並過濾掉空行
      const lines = text.split(/\r?\n/).map(line => line.trim()).filter(line => line.length > 0);
      if (lines.length < 1) return;

      // 2. 自動偵測分隔符號 (優先檢查 Tab，再檢查逗號)
      const firstLine = lines[0];
      const delimiter = firstLine.includes('\t') ? '\t' : ',';

      // 3. 解析標頭標籤，並自動修正過濾拼字錯誤
      let headers = parseLine(firstLine, delimiter).map(h => {
        let cleanHeader = h.trim();
        // 自動修復 passwor -> password
        if (cleanHeader.toLowerCase() === 'passwor') return 'password';
        return cleanHeader;
      });

      // 4. 開始處理每行數據
      jsonData = lines.slice(1).map((line) => {
        const values = parseLine(line, delimiter);
        let obj = {};
        headers.forEach((h, i) => {
          if (h) { // 確保欄位名不為空
            obj[h] = values[i] !== undefined ? smartTypeCast(values[i]) : "";
          }
        });
        return obj;
      });

      // 5. 渲染輸出
      document.getElementById("output").textContent = JSON.stringify(jsonData, null, 2);
    }

    // 複製到剪貼簿
    function copyToClipboard() {
      if (jsonData.length === 0) {
        alert("沒有可以複製的資料，請先進行轉換！");
        return;
      }
      const jsonText = JSON.stringify(jsonData, null, 2);
      navigator.clipboard.writeText(jsonText).then(() => {
        alert("📋 已成功複製 JSON 資料至剪貼簿！");
      }).catch(err => {
        alert("複製失敗，請手動全選複製。");
      });
    }

    // 下載 JSON 檔案
    function downloadJSON() {
      if (jsonData.length === 0) {
        alert("請先轉換資料！");
        return;
      }
      const blob = new Blob([JSON.stringify(jsonData, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "perfect_data.json";
      a.click();
      URL.revokeObjectURL(url);
    }

    // 清空
    function clearAll() {
      document.getElementById("inputText").value = "";
      document.getElementById("output").textContent = "// 轉換後的標準 JSON 將顯示於此";
      jsonData = [];
    }
  </script>
</body>
</html>
