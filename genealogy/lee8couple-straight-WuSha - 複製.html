<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>李氏家族生命大樹族譜 - 7-8代獨立視覺修正版</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            margin: 0;
            overflow: hidden;
            background-color: #f3eee6; /* 下方古樸暖宣紙色 */
        }
        #title-container {
            position: absolute;
            top: 15px;
            left: 20px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.96);
            padding: 12px 24px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            border-left: 5px solid #5c3e26;
        }
        h1 {
            margin: 0 0 5px 0;
            font-size: 22px;
            color: #3d2410;
        }
        p {
            margin: 0;
            font-size: 13px;
            color: #555;
            line-height: 1.4;
        }
        
        .link {
            fill: none;
            stroke-linecap: round;
            opacity: 0.95;
        }

        /* 1-3代樹幹外擴 20px */
        .trunk-zone-1-3 {
            fill: #52341b;
            stroke: #36200f;
            stroke-width: 2px;
        }

        /* 4-6代樹幹 */
        .trunk-zone-4-6 {
            fill: #7c5335;
            stroke: #52341b;
            stroke-width: 1.5px;
        }

        .room-splitter {
            fill: #f3eee6;
            opacity: 1;
            pointer-events: none;
        }

        /* 頂端 7-8 代純白背景 */
        .canopy-background {
            fill: #ffffff;
            stroke: none;
        }

        .node {
            cursor: pointer;
        }

        /* 1-6代 純文字樹幹節點 */
        .node-trunk-text text {
            fill: #fdfaf6 !important;
            font-size: 13px !important;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
        }

        /* 7-8代 樹葉節點文字 */
        .node-leaf-text text {
            font-size: 12px;
            font-weight: bold;
            fill: #221100;
            text-shadow: 1px 1px 1px #fff;
        }

        /* 樹葉懸停動畫 */
        .leaf-gen7, .leaf-gen8 {
            transition: transform 0.2s;
        }
        .node:hover .leaf-gen7 {
            transform: scale(1.3) !important;
        }
        .node:hover .leaf-gen8 {
            transform: scale(1.3) rotate(-35deg) !important;
        }

        #hint {
            position: absolute;
            bottom: 15px;
            right: 20px;
            background: #415545;
            color: #fff;
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 4px;
            opacity: 0.9;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="title-container">
        <h1>隴西李氏家族族譜 - 生命大樹 (7-8代獨立視覺修正版)</h1>
        <p><strong>錯誤修正：</strong>第 7 代樹葉（翠綠色）與第 8 代樹葉（嫩嫩嫩綠）完全獨立且清晰可見，徹底修正之前 7 代隱形的問題。</p>
        <p><strong>互動保留：</strong>點擊任意文字或樹葉，均可展開或收合子系。</p>
    </div>

    <div id="hint">💡 提示：點擊樹上「任意文字」或「7-8代不同顏色的樹葉」，即可展開或收合。</div>
    
    <div id="tree-container"></div>

    <script>
        const generationGens = ["繩", "祖", "武", "德", "業", "貽", "孫", "謀"];

        // --- 1. 資料產生器 ---
        function generateFamilyData() {
            const namePool = ["山", "川", "海", "峰", "宇", "宏", "強", "明", "志", "文", "武", "德", "賢", "才", "良", "平", "安", "康", "健", "新", "興", "昌", "盛", "榮", "華", "富", "貴", "生", "其", "克", "紹", "先", "光", "大", "廷"];

            function getRandomHusbandName(genIdx) {
                return `李${generationGens[genIdx]}${namePool[Math.floor(Math.random() * namePool.length)]}`;
            }

            let rootNode = { 
                name: "李繩舉", 
                isAlive: false, 
                children: [
                    { name: "李祖盛", isAlive: false, children: [] },
                    { name: "李祖志", isAlive: false, children: [] },
                    { name: "李祖宇", isAlive: false, children: [] }
                ]
            };
            
            const genSizes = [12, 24, 45, 70, 110]; 
            let currentGenNodes = rootNode.children;

            for (let g = 0; g < genSizes.length; g++) {
                let nextGenSize = genSizes[g];
                let nextGenNodes = [];
                let isThisGenAlive = (g >= 3); 

                for (let i = 0; i < nextGenSize; i++) {
                    let parentNode = currentGenNodes[i % currentGenNodes.length];
                    let child = { 
                        name: getRandomHusbandName(g + 2), 
                        isAlive: isThisGenAlive, 
                        children: [] 
                    };
                    if (!parentNode.children) parentNode.children = [];
                    parentNode.children.push(child);
                    nextGenNodes.push(child);
                }
                currentGenNodes = nextGenNodes;
            }

            return rootNode;
        }

        const familyData = generateFamilyData();

        // --- 2. D3.js 初始化 ---
        const width = window.innerWidth;
        const height = window.innerHeight;

        const svg = d3.select("#tree-container")
            .append("svg")
            .attr("width", width)
            .attr("height", height);

        const gBg = svg.append("g");
        const gMain = svg.append("g"); 

        const zoom = d3.zoom()
            .extent([[0, 0], [width, height]])
            .scaleExtent([0.05, 3]) 
            .on("zoom", (event) => { 
                gMain.attr("transform", event.transform); 
                gBg.attr("transform", event.transform);
            });
            
        svg.call(zoom);

        const tree = d3.tree().nodeSize([40, 150]); 

        let i = 0;
        const duration = 750; 
        let root = d3.hierarchy(familyData, d => d.children);
        
        const startY = height - 80; 
        root.x0 = 0; 
        root.y0 = startY;

        function autoCollapseTree(d) {
            if (d.depth >= 6 && d.children) {
                d._children = d.children;
                d.children = null;
            }
            if (d.children) d.children.forEach(autoCollapseTree);
        }
        autoCollapseTree(root);

        svg.call(zoom.transform, d3.zoomIdentity.translate(width / 2, 50).scale(0.7));

        update(root);

        function getRoomType(d) {
            if (!d.parent) return 'root'; 
            let ancestor = d;
            while (ancestor.depth > 1 && ancestor.parent) {
                ancestor = ancestor.parent;
            }
            if (ancestor.depth === 1 && ancestor.parent) {
                const siblings = ancestor.parent.children;
                const idx = siblings.indexOf(ancestor);
                if (idx === 0) return 'room1'; 
                if (idx === 1) return 'room2'; 
                if (idx === 2) return 'room3'; 
            }
            return 'room2';
        }

        // --- 3. 核心動態排版與渲染 ---
        function update(source) {
            const treeData = tree(root);
            const nodes = treeData.descendants();
            const links = treeData.links();

            const verticalGap = 145; 

            nodes.forEach(d => { 
                const sibs = nodes.filter(n => n.depth === d.depth);
                const idx = sibs.indexOf(d);
                const total = sibs.length;

                let currentGenWidth = 350 + (d.depth * 150);
                if (total > 30) currentGenWidth = total * 35; 
                
                const halfGenWidth = currentGenWidth / 2;

                if (total === 1) {
                    d.x = 0; 
                } else {
                    d.x = -halfGenWidth + (idx * (currentGenWidth / (total - 1)));
                }

                let baseSubY = startY - (d.depth * verticalGap);
                let offset = 0;

                if (d.depth === 3) {
                    offset = (idx % 2 === 0) ? -15 : 15; 
                } else if (d.depth === 4) {
                    offset = (idx % 2 === 0) ? -22 : 22; 
                } else if (d.depth === 5) {
                    offset = (idx % 3 === 0) ? -30 : ((idx % 3 === 1) ? 0 : 30);
                } else if (d.depth >= 6) {
                    offset = (idx % 3 === 0) ? -35 : ((idx % 3 === 1) ? -10 : 25);
                }

                d.y = baseSubY + offset;
            });

            // ---------------- 繪製白色背景與實心樹幹 ----------------
            gBg.selectAll('*').remove();
            gMain.selectAll('.trunk-zone-1-3, .trunk-zone-4-6, .room-splitter').remove();

            const t2TopY = startY - (5.4 * verticalGap); 
            gBg.append('rect')
                .attr('class', 'canopy-background')
                .attr('x', -10000)
                .attr('y', -10000)
                .attr('width', 20000)
                .attr('height', 10000 + t2TopY);

            const gen3Nodes = nodes.filter(d => d.depth === 2);
            if (gen3Nodes.length > 0) {
                const gen2Nodes = nodes.filter(d => d.depth === 1);
                const minX23 = Math.min(d3.min(gen2Nodes, d => d.x), d3.min(gen3Nodes, d => d.x)) - 65; 
                const maxX23 = Math.max(d3.max(gen2Nodes, d => d.x), d3.max(gen3Nodes, d => d.x)) + 65; 
                const t1TopY = startY - (2.2 * verticalGap);

                let path13 = `M -180 ${startY} 
                              C -160 ${startY - 80}, ${minX23} ${t1TopY + 30}, ${minX23} ${t1TopY}
                              L ${maxX23} ${t1TopY}
                              C ${maxX23} ${t1TopY + 30}, 160 ${startY - 80}, 180 ${startY} Z`;
                gMain.insert('path', ':first-child').attr('class', 'trunk-zone-1-3').attr('d', path13);
            }

            const gen6Nodes = nodes.filter(d => d.depth === 5);
            if (gen6Nodes.length > 0) {
                const minX6 = d3.min(gen6Nodes, d => d.x) - 45;
                const maxX6 = d3.max(gen6Nodes, d => d.x) + 45;
                const t1TopY = startY - (2.2 * verticalGap);

                const gen2Nodes = nodes.filter(d => d.depth === 1);
                const minX23 = Math.min(d3.min(gen2Nodes, d => d.x), d3.min(gen3Nodes, d => d.x)) - 65;
                const maxX23 = Math.max(d3.max(gen2Nodes, d => d.x), d3.max(gen3Nodes, d => d.x)) + 65;

                let path46 = `M ${minX23} ${t1TopY}
                              C ${minX23 + 20} ${t1TopY - 150}, ${minX6} ${t2TopY + 40}, ${minX6} ${t2TopY}
                              L ${maxX6} ${t2TopY}
                              C ${maxX6} ${t2TopY + 40}, ${maxX23 - 20} ${t1TopY - 150}, ${maxX23} ${t1TopY} Z`;
                gMain.insert('path', ':first-child').attr('class', 'trunk-zone-4-6').attr('d', path46);
            }

            const gen2Nodes = nodes.filter(d => d.depth === 1);
            if (gen2Nodes.length === 3 && gen6Nodes.length > 0) {
                gen2Nodes.sort((a, b) => a.x - b.x);
                gen6Nodes.sort((a, b) => a.x - b.x);

                const count6 = gen6Nodes.length;
                const p1_6 = gen6Nodes[Math.floor(count6 * 0.31)];
                const p2_6_left = gen6Nodes[Math.floor(count6 * 0.35)];
                const p2_6_right = gen6Nodes[Math.floor(count6 * 0.65)];
                const p3_6 = gen6Nodes[Math.floor(count6 * 0.69)];

                const yStartSplit = startY - (1.3 * verticalGap); 
                const yTopSplit = startY - (5.5 * verticalGap);

                let maskData1 = `M ${(gen2Nodes[0].x + gen2Nodes[1].x)/2} ${yStartSplit}
                                 L ${p1_6.x + 115} ${yTopSplit}
                                 L ${p2_6_left.x - 115} ${yTopSplit} Z`;

                let maskData2 = `M ${(gen2Nodes[1].x + gen2Nodes[2].x)/2} ${yStartSplit}
                                 L ${p2_6_right.x + 115} ${yTopSplit}
                                 L ${p3_6.x - 115} ${yTopSplit} Z`;

                gMain.insert('path', '.node').attr('class', 'room-splitter').attr('d', maskData1);
                gMain.insert('path', '.node').attr('class', 'room-splitter').attr('d', maskData2);
            }

            // ---------------- 節點渲染 (Nodes) ----------------
            const node = gMain.selectAll('g.node')
                .data(nodes, d => d.id || (d.id = ++i));

            const nodeEnter = node.enter().append('g')
                .attr("transform", d => `translate(${source.x0}, ${source.y0})`)
                .on('click', (event, d) => { click(event, d); });

            nodeEnter.each(function(d) {
                const group = d3.select(this);
                
                if (d.depth === 6) {
                    // 🍃 第 7 代樹葉：修正外擴路徑與顏色深度，確保對比度
                    group.attr("class", "node node-leaf-text");
                    group.append('path')
                        .attr('class', 'leaf-gen7')
                        // 修正：向外擴展且增加厚度
                        .attr('d', 'M 0,5 C -16,-14 -26,-7 -24,9 C -21,22 -9,26 0,28 C 9,26 21,22 24,9 C 26,-7 16,-14 0,5')
                        .style('stroke', '#1b5e20')
                        .style('stroke-width', '1.8px');
                } else if (d.depth >= 7) {
                    // 🌿 第 8 代樹葉：細長、旋轉
                    group.attr("class", "node node-leaf-text");
                    group.append('path')
                        .attr('class', 'leaf-gen8')
                        .attr('d', 'M 0,0 C -6,-16 -16,-10 -10,4 C -6,14 -2,20 2,22 C 7,18 14,8 10,-3 C 7,-10 4,-14 0,0')
                        .attr('transform', 'rotate(-25)')
                        .style('stroke', '#0d3c13')
                        .style('stroke-width', '1.5px');
                } else {
                    // 🪵 1-6 代：樹幹純文字
                    group.attr("class", "node node-trunk-text");
                }

                const displayText = d.data.name;
                if (d.depth <= 5) {
                    group.append('text')
                        .attr('x', 0)
                        .attr('dy', '.35em')
                        .attr('text-anchor', 'middle')
                        .text(displayText);
                } else {
                    group.append('text')
                        .attr('x', 14)
                        .attr('dy', '.35em')
                        .attr('text-anchor', 'start')
                        .attr('transform', 'rotate(70)')
                        .text(displayText);
                }
            });

            // 融合與更新（精準控制顏色）
            const nodeUpdate = nodeEnter.merge(node);
            nodeUpdate.transition().duration(duration)
                .attr("transform", d => `translate(${d.x}, ${d.y})`);

            // 🎨 第 7 代色彩修正：加深顏色（翠綠色系），未收合時改為翠綠 `#2e7d32`，收合時深翠綠 `#1b5e20`，絕對不用背景色
            nodeUpdate.selectAll('.leaf-gen7')
                .style('fill', d => d._children ? '#1b5e20' : (d.children ? '#1b5e20' : '#2e7d32')); 
                
            // 🎨 第 8 代色彩渲染（嫩黃綠色系）
            nodeUpdate.selectAll('.leaf-gen8')
                .style('fill', d => d._children ? '#33691e' : (d.children ? '#558b2f' : '#81c784'));

            node.exit().transition().duration(duration)
                .attr("transform", d => `translate(${source.x}, ${source.y})`)
                .remove();

            // ---------------- 樹幹線條 (Links) ----------------
            const link = gMain.selectAll('path.link')
                .data(links, d => d.target.id);

            function organicUpwardTreePath(s, d) {
                const midY = (s.y + d.y) / 2;
                return `M ${s.x} ${s.y} C ${s.x} ${midY}, ${d.x} ${midY + 20}, ${d.x} ${d.y}`;
            }

            const linkEnter = link.enter().insert('path', 'g')
                .attr('class', 'link')
                .attr('d', d => {
                    const o = { x: source.x0, y: source.y0 };
                    return organicUpwardTreePath(o, o);
                });

            const linkUpdate = linkEnter.merge(link);
            linkUpdate.transition().duration(duration)
                .attr('d', d => organicUpwardTreePath(d.source, d.target))
                .style('stroke', d => {
                    const room = getRoomType(d.target);
                    const depth = d.source.depth;
                    if (depth <= 0) return '#422815';
                    if (room === 'room2') return 'rgb(92, 62, 38)'; 
                    if (room === 'room1') return '#452F1C'; 
                    if (room === 'room3') return 'rgb(90, 46, 37)'; 
                    return 'rgb(92, 62, 38)';
                }) 
                .style('stroke-width', d => {
                    const trunkThickness = 30 - (d.source.depth * 4);
                    return `${Math.max(1.8, trunkThickness)}px`;
                });

            link.exit().transition().duration(duration)
                .attr('d', d => {
                    const o = { x: source.x, y: source.y };
                    return organicUpwardTreePath(o, o);
                }).remove();

            nodes.forEach(d => {
                d.x0 = d.x;
                d.y0 = d.y;
            });
        }

        // --- 全安全節點開合控制 ---
        function click(event, d) {
            if (event) event.stopPropagation();
            if (d.children) {
                d._children = d.children;
                d.children = null;
            } else if (d._children) {
                d.children = d._children;
                d._children = null;
            }
            update(d);
        }
    </script>
</body>
</html>
