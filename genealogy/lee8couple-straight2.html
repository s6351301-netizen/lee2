<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>李氏家族八代宗親夫妻並列族譜 (D3.js 直式最右字輩版)</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            margin: 0;
            overflow: hidden;
            background-color: #f4f7f9;
        }
        #title-container {
            position: absolute;
            top: 15px;
            left: 20px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 24px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-left: 5px solid #1a5276;
        }
        h1 {
            margin: 0 0 5px 0;
            font-size: 22px;
            color: #1a5276;
        }
        p {
            margin: 0;
            font-size: 13px;
            color: #555;
            line-height: 1.4;
        }
        /* D3 節點與線條樣式 */
        .node circle.husband {
            fill: #e3f2fd;
            stroke: #1e88e5;
            stroke-width: 2px;
            cursor: pointer;
        }
        .node circle.wife {
            fill: #fce4ec;
            stroke: #d81b60;
            stroke-width: 2px;
            cursor: pointer;
        }
        .node text {
            font-size: 13px;
            font-weight: bold;
        }
        /* 需求樣式：每一代最右側代表專用字樣 */
        .right-gen-label {
            font-family: "BiauKai", "DFKai-SB", "標楷體", sans-serif;
            font-size: 18px;
            font-weight: bold;
            fill: #ff0000; /* 紅色字 */
        }
        .text-husband {
            fill: #0d47a1;
        }
        .text-wife {
            fill: #880e4f;
        }
        .spouse-line {
            stroke: #f48fb1;
            stroke-width: 1.5px;
            stroke-dasharray: 2,2;
        }
        .link {
            fill: none;
            stroke: #b2c2d1;
            stroke-width: 1.5px;
        }
        /* 提示引導 */
        #hint {
            position: absolute;
            bottom: 15px;
            right: 20px;
            background: #333;
            color: #fff;
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 4px;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div id="title-container">
        <h1>隴西李氏家族族譜 - 直式右側字輩代表版</h1>
        <p><strong>字輩順序：</strong>繩 ➔ 祖 ➔ 武 ➔ 德 ➔ 業 ➔ 貽 ➔ 孫 ➔ 謀（共八代）</p>
        <p><strong>精確人數：</strong>1 ➔ 3 ➔ 10 ➔ 20 ➔ 50 ➔ 100 ➔ 150 ➔ 200（總計 534 對夫妻，僅各代最右側顯示字輩標記）</p>
    </div>

    <div id="hint">💡 提示：點擊任何圓圈可【展開/收合】子孫。滑鼠滾輪可【放大/縮小】、按住可【拖曳畫布】。</div>
    
    <div id="tree-container"></div>

    <script>
        const generationGens = ["繩", "祖", "武", "德", "業", "貽", "孫", "謀"];

        // --- 1. 資料產生器 ---
        function generateFamilyData() {
            const namePool = ["山", "川", "海", "峰", "宇", "宏", "強", "明", "志", "文", "武", "德", "賢", "才", "良", "平", "安", "康", "健", "新", "興", "昌", "盛", "榮", "華", "富", "貴", "生", "其", "克", "紹", "先", "光", "大", "廷"];
            const wifeSurPool = ["陳", "林", "黃", "張", "李", "王", "吳", "劉", "蔡", "楊", "許", "鄭", "謝", "洪", "郭", "邱", "曾", "廖", "賴", "徐"];
            const wifeNamePool = ["美", "玲", "婷", "芬", "芳", "娟", "蘭", "秀", "華", "鳳", "珍", "燕", "莉", "梅", "雅", "淑", "惠", "晴", "妤", "萱"];

            function getRandomHusbandName(genIdx) {
                const genChar = generationGens[genIdx];
                const lastChar = namePool[Math.floor(Math.random() * namePool.length)];
                return `李${genChar}${lastChar}`;
            }

            function getRandomWifeName() {
                let sur = "陳";
                do {
                    sur = wifeSurPool[Math.floor(Math.random() * wifeSurPool.length)];
                } while (sur === "李");
                
                const m1 = wifeNamePool[Math.floor(Math.random() * wifeNamePool.length)];
                const m2 = wifeNamePool[Math.floor(Math.random() * wifeNamePool.length)];
                return `${sur}${m1}${m2}`;
            }

            let rootNode = { 
                name: getRandomHusbandName(0), 
                wifeName: getRandomWifeName(),
                children: [] 
            };
            let currentGenNodes = [rootNode];

            const genSizes = [3, 10, 20, 50, 100, 150, 200]; 

            for (let g = 0; g < genSizes.length; g++) {
                let nextGenSize = genSizes[g];
                let nextGenNodes = [];

                for (let i = 0; i < nextGenSize; i++) {
                    let parentNode = currentGenNodes[i % currentGenNodes.length];
                    let child = { 
                        name: getRandomHusbandName(g + 1), 
                        wifeName: getRandomWifeName(),
                        children: [] 
                    };
                    if (!parentNode.children) parentNode.children = [];
                    parentNode.children.push(child);
                    nextGenNodes.push(child);
                }
                currentGenNodes = nextGenNodes;
            }
            return rootNode;
        }

        const familyData = generateFamilyData();

        // --- 2. D3.js 初始化畫布 ---
        const width = window.innerWidth;
        const height = window.innerHeight;

        const svg = d3.select("#tree-container")
            .append("svg")
            .attr("width", width)
            .attr("height", height);

        const gMain = svg.append("g"); 

        svg.call(d3.zoom()
            .extent([[0, 0], [width, height]])
            .scaleExtent([0.02, 3]) 
            .on("zoom", (event) => {
                gMain.attr("transform", event.transform);
            }));

        // 微調回適合正常名字的 nodeSize 間距
        const tree = d3.tree().nodeSize([140, 160]); 

        let i = 0;
        const duration = 750; 
        let root;

        root = d3.hierarchy(familyData, d => d.children);
        root.x0 = width / 2; 
        root.y0 = 0;

        root.children.forEach(collapse);

        function collapse(d) {
            if (d.children) {
                d._children = d.children;
                d._children.forEach(collapse);
                d.children = null;
            }
        }

        update(root);

        // --- 3. 核心繪圖與動態渲染函式 ---
        function update(source) {
            const treeData = tree(root);
            const nodes = treeData.descendants();
            const links = treeData.links();

            nodes.forEach(d => { d.y = d.depth * 160; });

            const xOffset = width / 2;
            const yOffset = 150;

            // 【關鍵邏輯】動態尋找當前畫面上「每一代最右側」的節點 ID
            // 建立一個 Map，Key 是代數 (depth)，Value 是目前找到 X 座標最大的節點物件
            const rightmostNodesPerGen = new Map();
            nodes.forEach(d => {
                if (!rightmostNodesPerGen.has(d.depth) || d.x > rightmostNodesPerGen.get(d.depth).x) {
                    rightmostNodesPerGen.set(d.depth, d);
                }
            });

            // 將最右側節點的 ID 存成一個集合 (Set)，方便繪圖時快速判斷
            const rightmostIds = new Set(Array.from(rightmostNodesPerGen.values()).map(d => d.id || i));

            // ---------------- 夫妻複合節點 (Nodes) 處理 ----------------
            const node = gMain.selectAll('g.node')
                .data(nodes, d => d.id || (d.id = ++i));

            // Enter: 建立節點容器群組
            const nodeEnter = node.enter().append('g')
                .attr('class', 'node')
                .attr("transform", d => `translate(${source.x0 + xOffset}, ${source.y0 + yOffset})`);

            // --- 繪製先生 ---
            nodeEnter.append('circle')
                .attr('class', 'husband')
                .attr('cx', 0)
                .attr('cy', 0)
                .attr('r', 1e-6)
                .on('click', (event, d) => { click(event, d); });

            nodeEnter.append('text')
                .attr('class', 'text-husband')
                .attr("dy", ".35em")
                .attr("x", -12)
                .attr("text-anchor", "end")
                .text(d => d.data.name);

            // --- 繪製夫妻連接線 ---
            nodeEnter.append('line')
                .attr('class', 'spouse-line')
                .attr('x1', 0)
                .attr('y1', 0)
                .attr('x2', 0)
                .attr('y2', 0);

            // --- 繪製太太 ---
            nodeEnter.append('circle')
                .attr('class', 'wife')
                .attr('cx', 0) 
                .attr('cy', 0)
                .attr('r', 1e-6)
                .on('click', (event, d) => { click(event, d); });

            nodeEnter.append('text')
                .attr('class', 'text-wife')
                .attr("dy", ".35em")
                .attr("x", 0)
                .attr("text-anchor", "start")
                .text(d => ` ⚭ ${d.data.wifeName}`)
                .style('fill-opacity', 1e-6);

            // --- 【新功能】在太太右側追加「代數與字輩代表」文字標記 ---
            nodeEnter.append('text')
                .attr('class', 'right-gen-label')
                .attr("dy", ".35em")
                .attr("text-anchor", "start")
                .style('fill-opacity', 1e-6); // 預設先隱藏


            // Update: 平移到直式新座標
            const nodeUpdate = nodeEnter.merge(node);
            const t = nodeUpdate.transition().duration(duration);
            
            t.attr("transform", d => `translate(${d.x + xOffset}, ${d.y + yOffset})`);

            // 先生圓圈更新
            nodeUpdate.select('circle.husband')
                .attr('r', 6.5)
                .style("fill", d => d._children ? "#1e88e5" : "#fff");

            // 太太圓圈水平右移 45px 位置更新
            const wifeXOffset = 45; 
            nodeUpdate.select('circle.wife')
                .attr('cx', wifeXOffset)
                .attr('r', 6.5);

            // 夫妻虛線更新
            nodeUpdate.select('line.spouse-line')
                .attr('x1', 6.5)
                .attr('y1', 0)
                .attr('x2', wifeXOffset - 6.5)
                .attr('y2', 0);

            // 太太文字顯現與位置更新
            nodeUpdate.select('text.text-wife')
                .attr('x', wifeXOffset + 11)
                .style('fill-opacity', 1);

            // --- 控制右側代表標記的顯示狀態 ---
            nodeUpdate.select('text.right-gen-label')
                // 根據當前節點是不是最右邊來動態計算位置與顯示
                .attr('x', wifeXOffset + 100) // 放在太太名字的右側
                .text(d => rightmostIds.has(d.id) ? ` ➔ 【第${d.depth + 1}代 : [${generationGens[d.depth]}]字輩】` : "")
                .style('fill-opacity', d => rightmostIds.has(d.id) ? 1 : 0);


            // Exit: 收合時縮回父輩位置
            const nodeExit = node.exit().transition()
                .duration(duration)
                .attr("transform", d => `translate(${source.x + xOffset}, ${source.y + yOffset})`)
                .remove();

            nodeExit.selectAll('circle').attr('r', 1e-6);
            nodeExit.selectAll('text').style('fill-opacity', 1e-6);
            nodeExit.select('circle.wife').attr('cx', 0);
            nodeExit.select('line.spouse-line').attr('x2', 0);


            // ---------------- 父子代際連接線處理 ----------------
            const link = gMain.selectAll('path.link')
                .data(links, d => d.target.id);

            function diagonal(s, d) {
                return `M ${s.x + xOffset} ${s.y + yOffset}
                        C ${s.x + xOffset} ${(s.y + d.y) / 2 + yOffset},
                          ${d.x + xOffset} ${(s.y + d.y) / 2 + yOffset},
                          ${d.x + xOffset} ${d.y + yOffset}`;
            }

            const linkEnter = link.enter().insert('path', 'g')
                .attr('class', 'link')
                .attr('d', d => {
                    const o = { x: source.x0, y: source.y0 };
                    return diagonal(o, o);
                });

            const linkUpdate = linkEnter.merge(link);
            linkUpdate.transition()
                .duration(duration)
                .attr('d', d => diagonal(d.source, d.target));

            link.exit().transition()
                .duration(duration)
                .attr('d', d => {
                    const o = { x: source.x, y: source.y };
                    return diagonal(o, o);
                })
                .remove();

            nodes.forEach(d => {
                d.x0 = d.x;
                d.y0 = d.y;
            });
        }

        // 點擊事件
        function click(event, d) {
            if (d.children) {
                d._children = d.children;
                d.children = null;
            } else {
                d.children = d._children;
                d._children = null;
            }
            update(d);
        }
    </script>
</body>
</html>
