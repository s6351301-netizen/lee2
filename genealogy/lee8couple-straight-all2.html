<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>李氏家族八代宗親夫妻並列族譜 (配偶直列/字輩置上版)</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            margin: 0;
            overflow: hidden;
            background-color: #f4f7f9;
        }
        #title-container {
            position: absolute;
            top: 15px;
            left: 20px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 24px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-left: 5px solid #1a5276;
        }
        h1 {
            margin: 0 0 5px 0;
            font-size: 22px;
            color: #1a5276;
        }
        p {
            margin: 0;
            font-size: 13px;
            color: #555;
            line-height: 1.4;
        }
        /* D3 節點與線條樣式 */
        .node circle.husband {
            fill: #e3f2fd;
            stroke: #1e88e5;
            stroke-width: 2px;
            cursor: pointer;
        }
        .node circle.wife {
            fill: #fce4ec;
            stroke: #d81b60;
            stroke-width: 2px;
            cursor: pointer;
        }
        .node text {
            font-weight: bold;
        }
        /* 新增：字輩標記文字專屬樣式，顏色稍淡、字體稍微縮小以凸顯層次 */
        .text-gen-info {
            font-size: 10px;
            fill: #7f8c8d;
        }
        .text-husband {
            font-size: 12px;
            fill: #0d47a1;
        }
        .text-wife {
            font-size: 12px;
            fill: #880e4f;
        }
        /* 垂直夫妻連接虛線 */
        .spouse-line {
            stroke: #f48fb1;
            stroke-width: 1.5px;
            stroke-dasharray: 2,2;
        }
        .link {
            fill: none;
            stroke: #b2c2d1;
            stroke-width: 1.5px;
        }
        /* 提示引導 */
        #hint {
            position: absolute;
            bottom: 15px;
            right: 20px;
            background: #333;
            color: #fff;
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 4px;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div id="title-container">
        <h1>隴西李氏家族族譜 - 夫妻並列版 (配偶直列/字輩置上)</h1>
        <p><strong>字輩順序：</strong>繩 ➔ 祖 ➔ 武 ➔ 德 ➔ 業 ➔ 貽 ➔ 孫 ➔ 謀（共八代）</p>
        <p><strong>精確人數：</strong>1 ➔ 3 ➔ 10 ➔ 20 ➔ 50 ➔ 100 ➔ 150 ➔ 200（代際橫向發展，字輩獨立於男性姓名上方）</p>
    </div>

    <div id="hint">💡 提示：點擊任何圓圈可【展開/收合】子孫。滑鼠滾輪可【放大/縮小】、按住可【拖曳畫布】。</div>
    
    <div id="tree-container"></div>

    <script>
        const generationGens = ["繩", "祖", "武", "德", "業", "貽", "孫", "謀"];

        // --- 1. 資料產生器：精確生成 534 位男性與非李姓配偶 ---
        function generateFamilyData() {
            const namePool = ["山", "川", "海", "峰", "宇", "宏", "強", "明", "志", "文", "武", "德", "賢", "才", "良", "平", "安", "康", "健", "新", "興", "昌", "盛", "榮", "華", "富", "貴", "生", "其", "克", "紹", "先", "光", "大", "廷"];
            const wifeSurPool = ["陳", "林", "黃", "張", "李", "王", "吳", "劉", "蔡", "楊", "許", "鄭", "謝", "洪", "郭", "邱", "曾", "廖", "賴", "徐"];
            const wifeNamePool = ["美", "玲", "婷", "芬", "芳", "娟", "蘭", "秀", "華", "鳳", "珍", "燕", "莉", "梅", "雅", "淑", "惠", "晴", "妤", "萱"];

            function getRandomHusbandName(genIdx) {
                const genChar = generationGens[genIdx];
                const lastChar = namePool[Math.floor(Math.random() * namePool.length)];
                return `李${genChar}${lastChar}`;
            }

            function getRandomWifeName() {
                let sur = "陳";
                do {
                    sur = wifeSurPool[Math.floor(Math.random() * wifeSurPool.length)];
                } while (sur === "李");
                
                const m1 = wifeNamePool[Math.floor(Math.random() * wifeNamePool.length)];
                const m2 = wifeNamePool[Math.floor(Math.random() * wifeNamePool.length)];
                return `${sur}${m1}${m2}`;
            }

            let rootNode = { 
                name: getRandomHusbandName(0), 
                wifeName: getRandomWifeName(),
                children: [] 
            };
            let currentGenNodes = [rootNode];

            const genSizes = [3, 10, 20, 50, 100, 150, 200]; 

            for (let g = 0; g < genSizes.length; g++) {
                let nextGenSize = genSizes[g];
                let nextGenNodes = [];

                for (let i = 0; i < nextGenSize; i++) {
                    let parentNode = currentGenNodes[i % currentGenNodes.length];
                    let child = { 
                        name: getRandomHusbandName(g + 1), 
                        wifeName: getRandomWifeName(),
                        children: [] 
                    };
                    if (!parentNode.children) parentNode.children = [];
                    parentNode.children.push(child);
                    nextGenNodes.push(child);
                }
                currentGenNodes = nextGenNodes;
            }
            return rootNode;
        }

        const familyData = generateFamilyData();

        // --- 2. D3.js 初始化畫布與畫布縮放 ---
        const width = window.innerWidth;
        const height = window.innerHeight;

        const svg = d3.select("#tree-container")
            .append("svg")
            .attr("width", width)
            .attr("height", height);

        const gMain = svg.append("g"); 

        svg.call(d3.zoom()
            .extent([[0, 0], [width, height]])
            .scaleExtent([0.01, 3]) 
            .on("zoom", (event) => {
                gMain.attr("transform", event.transform);
            }));

        // 因為字輩文字移到姓名上方佔用垂直空間，將垂直邊界從 75px 加大至 105px 防止重疊
        const tree = d3.tree().nodeSize([105, 260]); 

        let i = 0;
        const duration = 750; 
        let root;

        root = d3.hierarchy(familyData, d => d.children);
        root.x0 = height / 2; 
        root.y0 = 0;

        // 預設調整為全數展開，方便直接檢視
        update(root);

        // --- 3. 核心繪圖與動態渲染函式 ---
        function update(source) {
            const treeData = tree(root);
            const nodes = treeData.descendants();
            const links = treeData.links();

            // 每代相隔 260px
            nodes.forEach(d => { d.y = d.depth * 260; });

            const xOffset = 80;
            const yOffset = height / 2;

            // ---------------- 夫妻複合節點 (Nodes) 處理 ----------------
            const node = gMain.selectAll('g.node')
                .data(nodes, d => d.id || (d.id = ++i));

            const nodeEnter = node.enter().append('g')
                .attr('class', 'node')
                .attr("transform", d => `translate(${source.y0 + xOffset}, ${source.x0 + yOffset})`);

            // --- 繪製先生 (Husband) ---
            nodeEnter.append('circle')
                .attr('class', 'husband')
                .attr('cx', 0)
                .attr('cy', 0)
                .attr('r', 1e-6)
                .on('click', (event, d) => { click(event, d); });

            // 【核心修改】將代數與字輩搬移到男性的正上方 (dy 設成負值 -.65em 往上推)
            nodeEnter.append('text')
                .attr('class', 'text-gen-info')
                .attr("dy", "-.65em")
                .attr("x", 12)
                .attr("text-anchor", "start")
                .text(d => `(第${d.depth + 1}代/${generationGens[d.depth]}字輩)`);

            // 繪製先生本名 (dy 設成正常偏下的 .45em，與圓圈保持美觀高度)
            nodeEnter.append('text')
                .attr('class', 'text-husband')
                .attr("dy", ".45em")
                .attr("x", 12)
                .attr("text-anchor", "start")
                .text(d => d.data.name);

            // --- 繪製夫妻連接線 (改為垂直線段) ---
            nodeEnter.append('line')
                .attr('class', 'spouse-line')
                .attr('x1', 0)
                .attr('y1', 0)
                .attr('x2', 0)
                .attr('y2', 0);

            // --- 繪製太太 (Wife) ---
            nodeEnter.append('circle')
                .attr('class', 'wife')
                .attr('cx', 0) 
                .attr('cy', 0) 
                .attr('r', 1e-6)
                .on('click', (event, d) => { click(event, d); });

            // 保留設定：移除 ⚭ 無限符號，維持純淨文字並靠左對齊
            nodeEnter.append('text')
                .attr('class', 'text-wife')
                .attr("dy", ".35em")
                .attr("x", 12)
                .attr("text-anchor", "start")
                .text(d => ` ${d.data.wifeName}`)
                .style('fill-opacity', 1e-6);


            const nodeUpdate = nodeEnter.merge(node);
            const t = nodeUpdate.transition().duration(duration);
            
            t.attr("transform", d => `translate(${d.y + xOffset}, ${d.x + yOffset})`);

            nodeUpdate.select('circle.husband')
                .attr('r', 6.5)
                .style("fill", d => d._children ? "#1e88e5" : "#fff");

            // 太太圓圈改為垂直下移 32px (因先生上方有字輩，稍微拉大與配偶之垂直距離)
            const wifeYOffset = 32;
            nodeUpdate.select('circle.wife')
                .attr('cx', 0)
                .attr('cy', wifeYOffset)
                .attr('r', 6.5);

            // 夫妻虛線改為由夫(0, 6.5) 連接到 妻(0, 25.5) 的垂直線段
            nodeUpdate.select('line.spouse-line')
                .attr('x1', 0)
                .attr('y1', 6.5)
                .attr('x2', 0)
                .attr('y2', wifeYOffset - 6.5);

            // 太太文字水平與先生名字左側平行對齊
            nodeUpdate.select('text.text-wife')
                .attr('x', 12)
                .attr('y', wifeYOffset)
                .style('fill-opacity', 1);


            const nodeExit = node.exit().transition()
                .duration(duration)
                .attr("transform", d => `translate(${source.y + xOffset}, ${source.x + yOffset})`)
                .remove();

            nodeExit.selectAll('circle').attr('r', 1e-6);
            nodeExit.selectAll('text').style('fill-opacity', 1e-6);
            nodeExit.select('circle.wife').attr('cy', 0);
            nodeExit.select('line.spouse-line').attr('y2', 0);


            // ---------------- 父子代際連接線 (Links) 處理 ----------------
            const link = gMain.selectAll('path.link')
                .data(links, d => d.target.id);

            function diagonal(s, d) {
                return `M ${s.y + xOffset} ${s.x + yOffset}
                        C ${(s.y + d.y) / 2 + xOffset} ${s.x + yOffset},
                          ${(s.y + d.y) / 2 + xOffset} ${d.x + yOffset},
                          ${d.y + xOffset} ${d.x + yOffset}`;
            }

            const linkEnter = link.enter().insert('path', 'g')
                .attr('class', 'link')
                .attr('d', d => {
                    const o = { x: source.x0, y: source.y0 };
                    return diagonal(o, o);
                });

            const linkUpdate = linkEnter.merge(link);
            linkUpdate.transition()
                .duration(duration)
                .attr('d', d => diagonal(d.source, d.target));

            link.exit().transition()
                .duration(duration)
                .attr('d', d => {
                    const o = { x: source.x, y: source.y };
                    return diagonal(o, o);
                })
                .remove();

            nodes.forEach(d => {
                d.x0 = d.x;
                d.y0 = d.y;
            });
        }

        function click(event, d) {
            if (d.children) {
                d._children = d.children;
                d.children = null;
            } else {
                d.children = d._children;
                d._children = null;
            }
            update(d);
        }
    </script>
</body>
</html>
