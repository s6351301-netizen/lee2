<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新北市泰山職訓寶可夢打卡地圖-大門中央大樹</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        .info-panel {
            padding: 12px 15px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            border-radius: 8px;
            border-left: 5px solid #1a73e8;
            min-width: 200px;
        }
        .info-panel h4 { margin: 0 0 5px 0; color: #333; font-size: 16px; }
        .info-panel p { margin: 3px 0; color: #666; }
        .highlight { color: #e81123; font-weight: bold; font-size: 18px; }
        
        #action-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        .btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            width: 100%;
            margin-bottom: 10px;
        }
        .btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .btn-history { background-color: #2196F3; }
        .btn-logout { background-color: #ff9800; }
        
        #camera-view {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 2000;
        }
        #video {
            width: 100%; height: 100%; object-fit: cover;
        }
        
        #comparison-frame {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
        }
        .frame-blind {
            background: rgba(0, 0, 0, 0.75);
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 16px;
        }
        .center-row {
            display: flex;
            flex-grow: 1;
            justify-content: space-between;
        }
        .side-blind {
            background: rgba(0, 0, 0, 0.75);
            width: 10%;
        }
        .clear-window {
            border: 4px solid #ffeb3b;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5); 
            flex-grow: 1;
            border-radius: 12px;
            margin: 20px 0;
            position: relative;
            overflow: hidden; 
        }
        .clear-window::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 105%; height: 105%;
            background: url('icon/MountTai-Tree.png') no-repeat center;
            background-size: contain;
            opacity: 0.55;    
        }
        
        .ar-control-panel {
            position: absolute;
            bottom: 5%;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            max-width: 340px;
            text-align: center;
            z-index: 2100;
        }
        .ar-tip-text {
            color: #00FF00;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 0 0 8px #000;
            background: rgba(0,0,0,0.6);
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .capture-btn {
            background-color: #ff3b30;
            color: white;
            border: 2px solid white;
            padding: 14px 25px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            width: 100%;
        }
        .close-btn {
            position: absolute;
            top: 20px; right: 20px;
            background: rgba(255,255,255,0.8);
            border: none; padding: 8px 16px; border-radius: 5px;
            font-size: 14px; font-weight: bold; z-index: 2200;
        }
        
        /* 彈出視窗樣式 */
        #login-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92); z-index: 9999;
            display: none; flex-direction: column; justify-content: center; align-items: center; color: white;
        }
        #login-modal input { padding: 15px; border-radius: 8px; border: none; margin: 8px; width: 80%; max-width: 300px; font-size: 16px; text-align: center; color: black; }
    </style>
</head>
<body>

    <!-- 訓練家登入系統 (一開啟網頁強制彈出輸入欄位) -->
    <div id="login-modal">
        <h2>⚔️ 歡迎來到泰山寶可夢據點-大門中央大樹</h2>
        <p>請輸入您的基本資料以開始定位打卡</p>
        <input type="text" id="user-no" placeholder="請輸入編號或座號">
        <input type="text" id="username" placeholder="請輸入姓名">
        <button class="btn" style="max-width: 200px; margin-top: 15px;" onclick="loginTrainer()">進入地圖</button>
    </div>

    <div id="map"></div>

    <div id="action-container">
        <button id="ar-btn" class="btn" disabled onclick="openCameraWithComparison()">距離太遠（GPS 鎖定中）</button>
        <button class="btn btn-history" onclick="viewHistory()">查看歷史數據</button>
        <button class="btn btn-logout" onclick="logoutTrainer()">更換訓練家姓名/座號</button>
    </div>

    <div id="camera-view">
        <video id="video" autoplay playsinline></video>
        
        <div id="comparison-frame">
            <div class="frame-blind">📷 實景照片核對模式</div>
            <div class="center-row">
                <div class="side-blind"></div>
                <div class="clear-window"></div>
                <div class="side-blind"></div>
            </div>
            <div class="frame-blind" style="padding-bottom:120px;">⚠️ 畫面外觀若與照片不符則不計分</div>
        </div>
        
        <div class="ar-control-panel">
            <div class="ar-tip-text">
                🧩 請將手機移動，讓現場樹木景物<br>完美契合畫面中央的輪廓照片！
            </div>
            <button class="capture-btn" onclick="verifyAndScore()">[ 📸 拍照確認：確認外型無誤 ]</button>
        </div>
        <button class="close-btn" onclick="closeCamera()">關閉鏡頭</button>
    </div>

    <canvas id="hidden-canvas" style="display: none;"></canvas>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
// 地圖頁開頭：直接抓取前一頁存好的快取資料
let userNo = localStorage.getItem('trainerNo');
let userName = localStorage.getItem('trainerName');

// 防呆：如果發現快取沒資料，代表他沒走前一頁登入，強制踢回登入頁
if (!userNo || !userName) {
    alert("請先完成身份驗證！");
    window.location.href = "google-login.html"; 
}
        // 🎯 已更新為您的第 3 版 GAS 最新部署網址
        //第一頁簽為打卡成績 const GAS_URL = "https://script.google.com/macros/s/AKfycbyzXILXlGRyOKWFAxcpycRo9rUI9sRItATzgzE4TUvhPuVEdaerzKsU_Dbyw_pJTy1C/exec";
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzorUQHGMm-05sOgb3IoDuecnvmEI919Qw5dNXKO_xLesqi9sQVF67HAP3_t7pYmyUa/exec";
        let userNo = "";
        let userName = "";
        let lastSyncStatus = "尚未進行打卡同步"; 

        function loginTrainer() {
            const noInput = document.getElementById('user-no').value.trim();
            const nameInput = document.getElementById('username').value.trim();
            
            if(!noInput) return alert("請輸入有效的編號或座號！");
            if(!nameInput) return alert("請輸入有效的姓名！");
            
            // 儲存至瀏覽器快取
            localStorage.setItem('trainerNo', noInput);
            localStorage.setItem('trainerName', nameInput);
            userNo = noInput;
            userName = nameInput;
            
            // 隱藏登入視窗並初始化地圖資訊
            document.getElementById('login-modal').style.display = 'none';
            if (userMarker) {
                // 觸發一次 GPS 更新更新介面顯示的姓名
                navigator.geolocation.getCurrentPosition(function(position) {
                    const uLat = position.coords.latitude;
                    const uLng = position.coords.longitude;
                    const distance = getDistance(uLat, uLng, targetSpot.lat, targetSpot.lng);
                    info.update(distance, targetSpot.hasScored ? "此據點已完成打卡。" : "GPS 定位成功");
                });
            }
        }

        function logoutTrainer() {
            localStorage.removeItem('trainerNo');
            localStorage.removeItem('trainerName');
            userNo = "";
            userName = "";
            document.getElementById('user-no').value = "";
            document.getElementById('username').value = "";
            document.getElementById('login-modal').style.display = 'flex';
        }

        // 🔄 強制機制：每次「一打開網頁」就必須重新輸入（不自動抓舊資料）
        localStorage.removeItem('trainerNo');
        localStorage.removeItem('trainerName');
        document.getElementById('login-modal').style.display = 'flex';

        function syncToSheet(score) {
            const searchParams = new URLSearchParams();
            // 🎯 後端傳送參數：包含編號、姓名、成績，以及全新的「據點」
            searchParams.append('編號', userNo);
            searchParams.append('姓名', userName);
            searchParams.append('成績', score);
            searchParams.append('據點', '大門正中央大樹');

            lastSyncStatus = "正在嘗試上傳至雲端試算表...";

            fetch(GAS_URL, {
                method: 'POST',
                mode: 'no-cors', 
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: searchParams.toString()
            })
            .then(() => {
                lastSyncStatus = "🟢 數據已成功送出！請刷新試算表確認是否寫入。";
                console.log('數據已成功發送：', userNo, userName, score, '大門正中央大樹');
            })
            .catch(error => {
                lastSyncStatus = "🔴 連線失敗，請檢查網路或 GAS 網址是否填寫正確！";
                console.error(error);
            });
        }

        const targetSpot = {
            name: "泰山職訓中心",
            lat: 25.0435125, 
            lng: 121.4192113,
            score: 0,
            hasScored: false
        };

        function saveScoreToHistory(score) {
            const history = JSON.parse(localStorage.getItem('gameHistory') || '[]');
            history.push({
                date: new Date().toLocaleString(),
                score: score
            });
            localStorage.setItem('gameHistory', JSON.stringify(history));
        }

        function viewHistory() {
            const history = JSON.parse(localStorage.getItem('gameHistory') || '[]');
            let report = "";
            if (history.length === 0) {
                report = `【打卡歷史紀錄】\n\n目前尚無遊戲歷史紀錄。\n\n`;
            } else {
                report = `【[${userNo}] 訓練家 ${userName} 的歷史紀錄】\n\n`;
                history.forEach((entry, index) => {
                    report += `${index + 1}. ${entry.date} | 得分: +${entry.score}\n`;
                });
                report += `\n`;
            }
            report += `☁️ 雲端試算表連線狀態：\n${lastSyncStatus}\n`;
            alert(report);
        }

        const map = L.map('map').setView([targetSpot.lat, targetSpot.lng], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // 🎯 地圖標題標記修改：多加入了一行「大門正中央大樹」
        const targetMarker = L.marker([targetSpot.lat, targetSpot.lng]).addTo(map)
            .bindPopup(`<b>${targetSpot.name}</b><br>寶可夢據點<br><span style="color:#d9381e; font-weight:bold;">大門正中央大樹</span>`).openPopup();

        const detectionCircle = L.circle([targetSpot.lat, targetSpot.lng], {
            color: 'red',
            fillColor: '#f03',
            fillOpacity: 0.1,
            radius: 80 
        }).addTo(map);

        let userMarker = null;
        const info = L.control({ position: 'topright' });
        info.onAdd = function (map) {
            this._div = L.DomUtil.create('div', 'info-panel');
            this.update(null, "請先輸入右側資料進入地圖...");
            return this._div;
        };
        info.update = function (distance, scoreText) {
            let distStr = distance !== null ? `${distance.toFixed(1)} 公尺` : "未知";
            let displayNo = userNo || "未輸入";
            let displayName = userName || "未輸入";
            this._div.innerHTML = `
                <h4>訓練家打卡系統</h4>
                <p>帳號：<b>[${displayNo}] ${displayName}</b></p>
                <p>目前得分：<span class="highlight" style="color:green;">${targetSpot.score} 分</span></p>
                <p>目標景點：<b>${targetSpot.name}</b></p>
                <p>與目標距離：<span class="highlight">${distStr}</span></p>
                <p>狀態：${scoreText}</p>
            `;
        };
        info.addTo(map);

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(function(position) {
                const uLat = position.coords.latitude;
                const uLng = position.coords.longitude;

                if (!userMarker) {
                    userMarker = L.circleMarker([uLat, uLng], { radius: 8, color: '#1a73e8', fillColor: '#1a73e8', fillOpacity: 1 }).addTo(map);
                } else {
                    userMarker.setLatLng([uLat, uLng]);
                }

                const distance = getDistance(uLat, uLng, targetSpot.lat, targetSpot.lng);
                const arBtn = document.getElementById('ar-btn');

                if (distance <= 70) {
                    if (!targetSpot.hasScored) {
                        info.update(distance, "<span style='color:green; font-weight:bold;'>已進入 70 米打卡區！請啟動鏡頭。</span>");
                        arBtn.disabled = false;
                        arBtn.style.backgroundColor = "#4CAF50";
                        arBtn.innerText = "⚡ 進入 70 米範圍：開啟鏡頭核對";
                    } else {
                        info.update(distance, "此據點已完成打卡。");
                        arBtn.disabled = true;
                        arBtn.style.backgroundColor = "#cccccc";
                        arBtn.innerText = "已完成打卡";
                    }
                } else {
                    info.update(distance, "未進入 70 米範圍 (請繼續靠近)");
                    arBtn.disabled = true;
                    arBtn.style.backgroundColor = "#cccccc";
                    arBtn.innerText = "距離太遠（GPS 鎖定中）";
                }

            }, function(error) {
                console.error(error);
                info.update(null, "<span style='color:red;'>請開啟手機高精度 GPS 權限</span>");
            }, {
                enableHighAccuracy: true,
                maximumAge: 1000,
                timeout: 5000
            });
        }

        const video = document.getElementById('video');
        const cameraView = document.getElementById('camera-view');

        function openCameraWithComparison() {
            if(!userNo || !userName) {
                alert("請先完成基本資料輸入！");
                document.getElementById('login-modal').style.display = 'flex';
                return;
            }
            cameraView.style.display = 'block';
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
                .then(function(stream) {
                    video.srcObject = stream;
                })
                .catch(function(err) {
                    alert("無法啟動相機鏡頭。");
                    closeCamera();
                });
        }

        function verifyAndScore() {
            if (targetSpot.hasScored) {
                alert("此景點已得分，無法重複打卡！");
                closeCamera();
                return;
            }

            const currentLatLng = userMarker ? userMarker.getLatLng() : {lat: 0, lng: 0};
            const currentDist = getDistance(currentLatLng.lat, currentLatLng.lng, targetSpot.lat, targetSpot.lng);

            if (currentDist <= 80) {
                const canvas = document.getElementById('hidden-canvas');
                const ctx = canvas.getContext('2d');
                
                const vW = video.videoWidth;
                const vH = video.videoHeight;
                
                const cropW = vW * 0.5;
                const cropH = vH * 0.5;
                const cropX = (vW - cropW) / 2;
                const cropY = (vH - cropH) / 2;

                canvas.width = 100;
                canvas.height = 100;
                
                ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, canvas.width, canvas.height);
                const frameData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

                let greenPoints = 0;
                const totalPixels = canvas.width * canvas.height;

                for (let i = 0; i < frameData.length; i += 4) {
                    const r = frameData[i];
                    const g = frameData[i+1];
                    const b = frameData[i+2];
                    const isTreeGreen = (g > r * 1.1) && (g > b * 1.1) && (g > 30);
                    if (isTreeGreen) greenPoints++;
                }

                const greenRatio = greenPoints / totalPixels; 
                let precisionScore = Math.round((greenRatio / 0.15) * 100);
                precisionScore = Math.max(0, Math.min(100, precisionScore));

                if (precisionScore >= 90) {
                    targetSpot.score += 100;
                    targetSpot.hasScored = true;
                    
                    saveScoreToHistory(100);
                    syncToSheet(100);
                    
                    alert(`🌟 核對成功！\n經影像核對，樹木外型相似度達標：${precisionScore}%\n恭喜獲得寶可夢積分：+100 分！\n數據已發送至雲端試算表。`);
                    closeCamera();
                    info.update(currentDist, "<span style='color:gold; font-weight:bold;'>🎉 任務完成！順利得分。</span>");
                } else {
                    alert(`❌ 核對失敗（目前核對精確度：${precisionScore}%）\n\n【提示】：請將相機對準現場綠色樹木，並嘗試靠近或移動位置，讓樹木填入中央黃色框線中。`);
                }
            } else {
                alert("❌ 打卡失敗！您已離開 70 公尺範圍。");
                closeCamera();
            }
        }

        function closeCamera() {
            cameraView.style.display = 'none';
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
        }
    </script>
</body>
</html>
