<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>臺中市宗親人員統計與線路導航</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: "Microsoft JhengHei", "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f4f4;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        
        /* 右上角整合動態資訊面板 */
        .info-panel {
            padding: 15px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            border-radius: 8px;
            border-left: 5px solid #1a73e8;
            width: 340px;
            max-height: 520px;
            overflow-y: auto;
            position: relative;
        }
        .info-panel h4 {
            margin: 0 0 8px 0;
            color: #333;
            font-size: 16px;
            border-bottom: 2px solid #ddd;
            padding-bottom: 5px;
        }
        
        /* 控制鈕樣式 */
        .panel-controls {
            position: absolute;
            top: 12px;
            right: 12px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }
        .panel-btn {
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            color: #aaa;
            user-select: none;
        }
        .panel-btn:hover {
            color: #e81123;
        }

        .info-panel p {
            margin: 0 0 8px 0;
            color: #666;
        }
        .highlight-text {
            color: #e81123;
            font-weight: bold;
            font-size: 18px;
        }

        /* 表格與名單樣式 */
        .stats-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 10px;
            font-size: 13px;
        }
        .stats-table th, .stats-table td {
            border: 1px solid #ccc;
            padding: 5px;
            text-align: center;
        }
        .stats-table th {
            background-color: #f8f9fa;
            font-weight: bold;
        }
        .name-list-section {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed #bbb;
            font-size: 13px;
            line-height: 1.4;
        }
        .gender-title {
            font-weight: bold;
            color: #333;
            margin: 4px 0;
        }
        .male-color { color: #0056b3; }
        .female-color { color: #b21f1f; }
        .name-string {
            color: #555;
            word-break: break-all;
        }

        /* 姓名超連結樣式 */
        .clickable-name {
            color: #1a73e8;
            text-decoration: underline;
            cursor: pointer;
            margin-right: 8px;
            display: inline-block;
        }
        .clickable-name:hover {
            color: #0d47a1;
            font-weight: bold;
        }

        /* 導航輸入框樣式 */
        .nav-input-group {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 2px solid #ddd;
            font-size: 13px;
        }
        .nav-row {
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }
        .nav-row label {
            width: 75px;
            font-weight: bold;
            color: #444;
        }
        .nav-row input {
            flex: 1;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 12px;
        }
        .nav-btn-container {
            text-align: right;
            margin-top: 5px;
        }
        .go-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 6px 18px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        .go-btn:hover {
            background-color: #218838;
        }

        /* 左上角總統計表面板 */
        .total-stats-panel {
            padding: 12px;
            font-size: 13px;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            border-top: 5px solid #6f42c1;
            width: 320px;
            max-height: 400px;
            overflow-y: auto;
            position: relative;
            margin-top: 10px;
        }
        .total-stats-panel h4 {
            margin: 0 0 8px 0;
            color: #222;
            font-size: 14px;
            text-align: center;
            border-bottom: 2px solid #ddd;
            padding-bottom: 5px;
        }
        .sub-title {
            font-weight: bold;
            margin: 10px 0 5px 0;
            color: #555;
            font-size: 12px;
        }
        
        /* 新功能：靈感來源完全透明與融合樣式 */
        .inspiration-panel {
            padding: 0px;
            background: transparent; /* 完全透明 */
            box-shadow: none;        /* 移除陰影 */
            border: none;            /* 移除外框與左條 */
            width: auto;             /* 大小縮小，隨內容自適應 */
            position: relative;
            margin-top: 0px;         /* 往上移，無間距 */
            font-size: 12px;         /* 字體稍微縮小達到減半視覺 */
        }
        .inspiration-panel p {
            margin: 0;
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: bold;
            color: #333;             /* 文字顏色，可確保在電子地圖上有一定辨識度 */
            text-shadow: 1px 1px 1px rgba(255,255,255,0.8); /* 加上微弱文字白底陰影，避免地圖顏色太深看不清字 */
        }
        .inspiration-panel a {
            display: inline-flex;
            align-items: center;
        }
        .hint-text {
            font-size: 11px;
            color: #555;
            font-weight: normal;
            margin-left: 2px;
        }

        /* 自訂滑鼠移過去時區塊內顯示的文字樣式 */
        .custom-tooltip {
            background-color: rgba(0, 0, 0, 0.75) !important;
            border: none !important;
            border-radius: 4px !important;
            color: #fff !important;
            font-weight: bold !important;
            font-size: 13px !important;
            padding: 4px 8px !important;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3) !important;
        }

        /* 隱藏 Leaflet 原生導航文字說明 */
        .leaflet-routing-container, 
        .leaflet-routing-error,
        .leaflet-routing-alt {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.11.0/proj4.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

    <script>
        const twd97 = "+proj=tmerc +lat_0=0 +lon_0=121 +k=0.9999 +x_0=250000 +y_0=0 +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs";
        const wgs84 = "+proj=longlat +ellps=WGS84 +datum=WGS84 +no_defs";

        const taichungDistricts = [
            "大甲區", "外埔區", "大安區", "日南區", "清水區", "沙鹿區", "梧棲區", "龍井區", 
            "太平區", "大里區", "霧峰區", "烏日區", "豐原區", "後里區", "石岡區", 
            "東勢區", "新社區", "潭子區", "大雅區", "神岡區", "大肚區", "和平區", 
            "中區", "東區", "南區", "西區", "北區", "西屯區", "南屯區", "北屯區"  
        ];

        const map = L.map('map').setView([24.182, 120.713], 11);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        let geojsonLayer;
        let taichungPeopleData = []; 
        let routingControl = null;   
        let lastClickedPerson = { name: "", address: "" }; 

        let isObservationPanelMinimized = false;
        let isTotalStatsPanelMinimized = false;
        
        let currentObservationProps = null;
        let currentObservationIndex = undefined;
        let currentObservationFeature = null;

        // 行政區篩選防禦機制，避免交叉污染
        function filterByDistrict(peopleList, districtName) {
            return peopleList.filter(p => {
                if (!p.address) return false;
                
                const cleanAddress = p.address;
                const shortName = districtName.replace('區', '');

                if (districtName === "日南區") {
                    return cleanAddress.includes("日南");
                }
                if (districtName === "集中區") {
                    return false; 
                }
                if (districtName === "中區") {
                    return cleanAddress.includes("開區") || cleanAddress.includes("中區") || cleanAddress.includes("台中市中") || cleanAddress.includes("臺中市中");
                }
                
                if ((shortName === "西" || shortName === "南" || shortName === "北" || shortName === "東") && cleanAddress.includes("大甲")) {
                    return false;
                }
                
                return cleanAddress.includes(shortName);
            });
        }

        function defaultStyle(feature) {
            return {
                fillColor: '#3a7bd5',  
                weight: 2,             
                opacity: 1,            
                color: '#ffffff',      
                fillOpacity: 0.35      
            };
        }

        function highlightFeature(e) {
            const layer = e.target;
            layer.setStyle({
                fillColor: '#48d1cc',   
                weight: 4,              
                color: '#4a4a4a',       
                fillOpacity: 0.2        
            });
            if (!L.Browser.ie && !L.Browser.opera && !L.Browser.edge) {
                layer.bringToFront();
            }
        }

        function resetHighlight(e) {
            geojsonLayer.resetStyle(e.target);
        }

        function onFeatureClick(e) {
            map.fitBounds(e.target.getBounds());
            info.update(e.target.feature.properties, e.target.feature._geoIndex, e.target.feature);
        }

        function getDistrictName(props, geoIndex, feature) {
            let name = "未知區域";
            if (props) {
                name = props.區名 || props.TOWNNAME || "未知區域";
            }
            if (geoIndex === 25) name = "梧棲區";
            if (geoIndex === 27) name = "龍井區";

            if (feature && turf.getType(feature)) {
                try {
                    const centroid = turf.centroid(feature);
                    const lng = centroid.geometry.coordinates[0];
                    if (name === "梧棲區" && lng > 120.75) {
                        return "新社區";
                    }
                } catch (err) {
                    console.error("空間質心計算錯誤: ", err);
                }
            }
            return name;
        }

        function onEachFeature(feature, layer) {
            const districtName = getDistrictName(feature.properties, feature._geoIndex, feature);
            
            // 綁定 Tooltip，讓滑鼠移過去時區塊內直接顯示該行政區文字
            layer.bindTooltip(districtName, {
                sticky: true,           // 讓文字標籤跟著滑鼠游標移動
                direction: 'auto',      // 自動判斷顯示方向
                className: 'custom-tooltip' // 使用上方自訂的 CSS 樣式
            });

            layer.on({
                mouseover: function(e) {
                    highlightFeature(e);
                    // 同時更新右側臺中市宗親人員統計面板
                    info.update(e.target.feature.properties, e.target.feature._geoIndex, e.target.feature);
                },
                mouseout: resetHighlight,
                click: onFeatureClick
            });
            layer.bindPopup(`<strong style="font-size:14px;">${districtName}</strong>`);
        }

        // 點擊人名觸發的核心函數
        window.handleNameClick = function(encodedAddr, encodedName) {
            const address = decodeURIComponent(encodedAddr);
            const name = decodeURIComponent(encodedName);
            lastClickedPerson = { name: name, address: address };
            planRouteFromInputToPerson(address, name);
        };

        // --- 左上角「靈感來源」浮動視窗 (完全透明融合版) ---
        const inspirationPanel = L.control({ position: 'topleft' });
        inspirationPanel.onAdd = function (map) {
            this._div = L.DomUtil.create('div', 'inspiration-panel');
            this._div.id = 'inspiration-window';
            this._div.innerHTML = `
                <p>
                    靈感來源
                    <a href="https://www.lib.ncku.edu.tw/search/heritage/pdf/A10102.pdf" class="成功大學-典範傳承~講座教授的故事" target="_blank">
                        <img src="https://market.cloud.edu.tw/images/file/pdf.png" alt="" width="17" height="17">
                    </a>
                    <span class="hint-text">點擊PDF圖片看文章</span>
                </p>
            `;
            // 防止點擊透傳到地圖上
            L.DomEvent.disableClickPropagation(this._div);
            return this._div;
        };
        inspirationPanel.addTo(map);


        // --- 右上角整合型觀測面板 ---
        const info = L.control({ position: 'topright' });
        info.onAdd = function (map) {
            this._div = L.DomUtil.create('div', 'info-panel');
            this._div.id = 'observation-panel-window';
            this.update();
            return this._div;
        };
        
        info.toggleMinimize = function() {
            isObservationPanelMinimized = !isObservationPanelMinimized;
            this.update(currentObservationProps, currentObservationIndex, currentObservationFeature);
        };

        info.update = function (props, geoIndex, feature) {
            if(props !== undefined || geoIndex !== undefined || feature !== undefined) {
                currentObservationProps = props;
                currentObservationIndex = geoIndex;
                currentObservationFeature = feature;
            }

            const districtName = currentObservationProps || currentObservationIndex !== undefined ? getDistrictName(currentObservationProps, currentObservationIndex, currentObservationFeature) : null;
            
            if (isObservationPanelMinimized) {
                this._div.innerHTML = `
                    <div class="panel-controls" style="position: static;">
                        <span class="panel-btn" onclick="info.toggleMinimize()">➕</span>
                    </div>
                `;
                this._div.style.padding = "6px 10px";
                this._div.style.width = "fit-content";
                return;
            }

            this._div.style.padding = "15px";
            this._div.style.width = "340px";

            const defaultNavHtml = `
                <div class="nav-input-group">
                    <div class="nav-row">
                        <label>來源地址：</label>
                        <input type="text" id="srcLocation" value="李武略宗祠">
                    </div>
                    <div class="nav-row">
                        <label>目標景點：</label>
                        <input type="text" id="targetLocation" placeholder="例如：台中火車站">
                    </div>
                    <div class="nav-btn-container">
                        <button class="go-btn" onclick="planRouteFromPersonToTarget()">前往景點</button>
                    </div>
                </div>
            `;

            if (!districtName || districtName === "未知區域") {
                this._div.innerHTML = `
                    <div class="panel-controls">
                        <span class="panel-btn" onclick="info.toggleMinimize()">➖</span>
                    </div>
                    <h4>臺中市宗親人員統計與線路導航</h4>
                    <p style="margin:5px 0 0 0; color:#e81123; font-weight:bold;">請將滑鼠移至地圖各區查看宗親名單</p>
                    ${defaultNavHtml}
                `;
                return;
            }

            const distPeople = filterByDistrict(taichungPeopleData, districtName);
            const males = distPeople.filter(p => p.gender === '男' || p.gender === '男性');
            const females = distPeople.filter(p => p.gender === '女' || p.gender === '女性');
            
            const generateNameLinks = (peopleArray) => {
                if (peopleArray.length === 0) return '無';
                return peopleArray.map(p => {
                    const encAddr = encodeURIComponent(p.address);
                    const encName = encodeURIComponent(p.name);
                    return `<span class="clickable-name" onclick="window.handleNameClick('${encAddr}', '${encName}')">${p.name}</span>`;
                }).join('，');
            };

            this._div.innerHTML = `
                <div class="panel-controls">
                    <span class="panel-btn" onclick="info.toggleMinimize()">➖</span>
                </div>
                <h4>臺中市宗親人員統計與線路導航</h4>
                <p>目前鎖定：<span class="highlight-text">${districtName}</span></p>
                <p style="font-size:12px; color:#1a73e8; margin-top:-5px;">💡 提示：點擊藍色人名，即可啟動路徑導航</p>
                
                <table class="stats-table">
                    <thead>
                        <tr>
                            <th>男性</th>
                            <th>女性</th>
                            <th>合計</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>${males.length} 人</td>
                            <td>${females.length} 人</td>
                            <td style="font-weight:bold; color:#e81123;">${distPeople.length} 人</td>
                        </tr>
                    </tbody>
                </table>
                
                <div class="name-list-section">
                    <div class="gender-title male-color">👨 男性名單 (${males.length}人)：</div>
                    <div class="name-string">${generateNameLinks(males)}</div>
                </div>
                <div class="name-list-section">
                    <div class="gender-title female-color">👩 女性名單 (${females.length}人)：</div>
                    <div class="name-string">${generateNameLinks(females)}</div>
                </div>

                <div class="nav-input-group">
                    <div class="nav-row">
                        <label>來源地址：</label>
                        <input type="text" id="srcLocation" value="李武略宗祠">
                    </div>
                    <div class="nav-row">
                        <label>目標景點：</label>
                        <input type="text" id="targetLocation" placeholder="例如：台中火車站">
                    </div>
                    <div class="nav-btn-container">
                        <button class="go-btn" onclick="planRouteFromPersonToTarget()">前往景點</button>
                    </div>
                </div>
            `;
            
            L.DomEvent.disableClickPropagation(this._div);
            L.DomEvent.disableScrollPropagation(this._div);
        };
        info.addTo(map);

        // --- 左上角總統計面板 ---
        const totalStatsPanel = L.control({ position: 'topleft' });
        totalStatsPanel.onAdd = function (map) {
            this._div = L.DomUtil.create('div', 'total-stats-panel');
            this._div.id = 'total-stats-window';
            this.update();
            return this._div;
        };

        totalStatsPanel.toggleMinimize = function() {
            isTotalStatsPanelMinimized = !isTotalStatsPanelMinimized;
            this.update();
        };

        totalStatsPanel.update = function () {
            if (isTotalStatsPanelMinimized) {
                this._div.innerHTML = `
                    <div class="panel-controls" style="position: static;">
                        <span class="panel-btn" onclick="totalStatsPanel.toggleMinimize()">➕</span>
                    </div>
                `;
                this._div.style.padding = "6px 10px";
                this._div.style.width = "fit-content";
                return;
            }

            this._div.style.padding = "12px";
            this._div.style.width = "320px";

            if (taichungPeopleData.length === 0) {
                this._div.innerHTML = `<h4>台中市宗親總統計表</h4><p>資料載入中...</p>`;
                return;
            }

            const totalMales = taichungPeopleData.filter(p => p.gender === '男' || p.gender === '男性').length;
            const totalFemales = taichungPeopleData.filter(p => p.gender === '女' || p.gender === '女性').length;
            const totalCount = taichungPeopleData.length;

            let districtRowsHtml = '';
            taichungDistricts.forEach(dist => {
                const distPeople = filterByDistrict(taichungPeopleData, dist);
                const dMales = distPeople.filter(p => p.gender === '男' || p.gender === '男性').length;
                const dFemales = distPeople.filter(p => p.gender === '女' || p.gender === '女性').length;
                const dTotal = distPeople.length;
                const percentage = totalCount > 0 ? ((dTotal / totalCount) * 100).toFixed(2) : "0.00";
                
                districtRowsHtml += `
                    <tr>
                        <td style="font-weight:bold;">${dist}</td>
                        <td>${dMales}</td>
                        <td>${dFemales}</td>
                        <td style="font-weight:bold; color:#e81123;">${dTotal}</td>
                        <td style="color:#28a745;">${percentage}%</td>
                    </tr>
                `;
            });

            this._div.innerHTML = `
                <div class="panel-controls">
                    <span class="panel-btn" onclick="totalStatsPanel.toggleMinimize()">➖</span>
                </div>
                <h4>台中市宗親總統計表</h4>
                <div class="sub-title">📊 全市總計人數</div>
                <table class="stats-table">
                    <thead>
                        <tr><th>總男性</th><th>總女性</th><th>台中總計</th></tr>
                    </thead>
                    <tbody>
                        <tr><td>${totalMales} 人</td><td>${totalFemales} 人</td><td style="font-weight:bold; color:#6f42c1;">${totalCount} 人</td></tr>
                    </tbody>
                </table>
                <div class="sub-title">🏘️ 各行政區人口一覽</div>
                <table class="stats-table" style="font-size: 11px;">
                    <thead>
                        <tr style="background-color:#eef2f7;"><th>行政區</th><th>男</th><th>女</th><th>總計</th><th>比例</th></tr>
                    </thead>
                    <tbody>${districtRowsHtml}</tbody>
                </table>
            `;
            
            L.DomEvent.disableClickPropagation(this._div);
            L.DomEvent.disableScrollPropagation(this._div);
        };
        totalStatsPanel.addTo(map);

        function getLatLngByAddress(address, callback) {
            if(!address) return;
            let cleanAddr = address.split("';")[0].split('";')[0].replace("台中市 ", "").replace("臺中市 ", "");
            
            if (cleanAddr.trim() === "李武略宗祠") {
                callback(24.33774, 120.61888);
                return;
            }

            function fetchAddress(searchAddr, isRetry = false) {
                const geocodeUrl = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent("台中市" + searchAddr)}&limit=1`;
                fetch(geocodeUrl)
                    .then(res => res.json())
                    .then(geoResult => {
                        if (geoResult.length === 0 && !isRetry) {
                            const fuzzyAddress = searchAddr.replace(/\d+([號樓-].*)?$/, '');
                            fetchAddress(fuzzyAddress, true);
                            return;
                        }
                        if (geoResult.length === 0) {
                            alert(`無法解析地址：${cleanAddr}`);
                            return;
                        }
                        callback(parseFloat(geoResult[0].lat), parseFloat(geoResult[0].lon));
                    })
                    .catch(err => {
                        alert(`解析地址出錯：${err.message}`);
                    });
            }
            fetchAddress(cleanAddr);
        }

        function drawCleanRoute(startLat, startLng, endLat, endLng) {
            if (routingControl) {
                map.removeControl(routingControl);
            }
            routingControl = L.Routing.control({
                waypoints: [L.latLng(startLat, startLng), L.latLng(endLat, endLng)],
                addWaypoints: false,
                fitSelectedRoutes: true,
                createMarker: function() { return null; },
                lineStyle: {
                    styles: [{ color: '#e81123', opacity: 0.8, weight: 4 }]
                }
            }).addTo(map);
        }

        function planRouteFromInputToPerson(personAddress, personName) {
            const srcEl = document.getElementById("srcLocation");
            const srcInput = srcEl ? srcEl.value : "李武略宗祠";
            if (!srcInput) {
                alert("請填寫來源地址！");
                return;
            }
            getLatLngByAddress(srcInput, function(srcLat, srcLng) {
                getLatLngByAddress(personAddress, function(destLat, destLng) {
                    drawCleanRoute(srcLat, srcLng, destLat, destLng);
                });
            });
        }

        function planRouteFromPersonToTarget() {
            if (!lastClickedPerson.address) {
                alert("請先在名單中點擊任一宗親的名字作為出發起點！");
                return;
            }
            const targetEl = document.getElementById("targetLocation");
            const targetInput = targetEl ? targetEl.value : "";
            if (!targetInput) {
                alert("請輸入目標景點名稱！");
                return;
            }
            getLatLngByAddress(lastClickedPerson.address, function(srcLat, srcLng) {
                getLatLngByAddress(targetInput, function(destLat, destLng) {
                    drawCleanRoute(srcLat, srcLng, destLat, destLng);
                });
            });
        }

        function convertCoords(coords, type) {
            if (type === "Point") return proj4(twd97, wgs84, coords);
            if (type === "LineString" || type === "MultiPoint") return coords.map(p => proj4(twd97, wgs84, p));
            if (type === "Polygon" || type === "MultiLineString") return coords.map(ring => ring.map(p => proj4(twd97, wgs84, p)));
            if (type === "MultiPolygon") return coords.map(poly => poly.map(ring => ring.map(p => proj4(twd97, wgs84, p))));
            return coords;
        }

        const jsonUrl = 'https://s6351301-netizen.github.io/lee/json/TaichungCityBoundary_TWD97-1.json';
        const dataUrl = 'https://s6351301-netizen.github.io/lee/json/data2.json';

        fetch(dataUrl)
            .then(res => res.json())
            .then(database => {
                taichungPeopleData = database.map(item => {
                    let rawName = item.name || "未知";
                    let rawAddr = item.address || "";

                    if (rawName.includes("區") || rawName.includes("路") || rawName.includes("'") || rawName.includes(" planRoute")) {
                        const match = rawName.match(/[\u4e00-\u9fa5]{2,4}/);
                        rawName = match ? match[0] : "未知";
                    }

                    if (rawAddr.includes("';") || rawAddr.includes("\";") || rawAddr.includes("}")) {
                        rawAddr = rawAddr.split("';")[0].split('";')[0].split('}')[0];
                    }
                    rawAddr = rawAddr.replace(/<[^>]*>/g, "");

                    return {
                        name: rawName.trim(),
                        gender: item.gender || "男",
                        address: rawAddr.trim()
                    };
                }).filter(item => item.address.includes("台中") || item.address.includes("臺中"));
                
                totalStatsPanel.update();
                return fetch(jsonUrl);
            })
            .then(response => response.json())
            .then(data => {
                data.features.forEach((feature, index) => {
                    feature._geoIndex = index;
                    if (feature.geometry && feature.geometry.coordinates) {
                        feature.geometry.coordinates = convertCoords(feature.geometry.coordinates, feature.geometry.type);
                    }
                    if (index === 25 && turf.getType(feature)) {
                        if(!feature.properties) feature.properties = {};
                        feature.properties.區名 = "梧棲區";
                    }
                    if (index === 27 && turf.getType(feature)) {
                        if(!feature.properties) feature.properties = {};
                        feature.properties.區名 = "龍井區";
                    }
                });

                geojsonLayer = L.geoJSON(data, {
                    style: defaultStyle,
                    onEachFeature: onEachFeature
                }).addTo(map);
            })
            .catch(error => {
                console.error('初始化失敗：', error);
            });
    </script>
