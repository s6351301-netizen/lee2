<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>臺中市行政區地圖 - 區塊懸浮立體特效</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: "Microsoft JhengHei", "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f4f4;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        /* 右上角動態資訊面板 */
        .info-panel {
            padding: 12px 20px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            border-radius: 8px;
            border-left: 5px solid #1a73e8;
            min-width: 220px;
        }
        .info-panel h4 {
            margin: 0 0 8px 0;
            color: #333;
            font-size: 18px;
        }
        .info-panel p {
            margin: 0;
            color: #666;
        }
        .highlight-text {
            color: #e81123;
            font-weight: bold;
            font-size: 22px;
        }
    </style>
</head>
<body>

    <div id="map"></div>

   <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
   <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.11.0/proj4.js"></script>

    <script>
        // 定義 TWD97 (EPSG:3826) 與 WGS84 經緯度 (EPSG:4326) 的投影引數
        const twd97 = "+proj=tmerc +lat_0=0 +lon_0=121 +k=0.9999 +x_0=250000 +y_0=0 +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs";
        const wgs84 = "+proj=longlat +ellps=WGS84 +datum=WGS84 +no_defs";

        // 1. 初始化地圖，預設定位在大甲區附近，並將縮放層級提高到 13 以便看清街道名稱
        const map = L.map('map').setView([24.348, 120.623], 13);

        // 2. 導入能清晰看到詳細中文街道名稱的電子地圖（OpenStreetMap 標準圖資）
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        let geojsonLayer;

        // 3. 設定區塊的「常態基本樣式」
        function defaultStyle(feature) {
            return {
                fillColor: '#3a7bd5',  // 預設質感藍色填充
                weight: 2,             // 區界線粗細
                opacity: 1,            // 線條透明度
                color: '#ffffff',      // 白色區界線
                fillOpacity: 0.35      // 稍微調低透明度，讓底圖的街道與路名更清晰
            };
        }

        // 4. 當滑鼠移入（Hover）時的「浮起/高亮特效」
        function highlightFeature(e) {
            const layer = e.target;

            layer.setStyle({
                fillColor: '#48d1cc',   // 移入時轉為亮眼桃紅
                weight: 4,              // 邊框加粗（製造向上浮出感）
                color: '#4a4a4a',       // 邊框變深色加強立體感
                fillOpacity: 0.2        // 顏色加濃數字小透明度高
            });

            // 核心關鍵：將該區塊移到圖層最上層，確保四周加粗的邊框不會被鄰近區塊遮住
            if (!L.Browser.ie && !L.Browser.opera && !L.Browser.edge) {
                layer.bringToFront();
            }

            info.update(layer.feature.properties);
        }

        // 5. 當滑鼠移出時，還原回原本樣式
        function resetHighlight(e) {
            geojsonLayer.resetStyle(e.target);
            info.update(); 
        }

        // 6. 點擊行政區時，地圖自動縮放到該區範圍
        function zoomToFeature(e) {
            map.fitBounds(e.target.getBounds());
        }

        // 7. 自動偵測您 JSON 內隱含的行政區名稱欄位（並修正指定未知區域之名稱）
        function getDistrictName(props) {
            if (!props) return "未知行政區";
            let name = props.區名 || props.TOWNNAME || props.TNAME || "未知區域";
            
            // 針對該特徵圖資中的特定「未知區域」進行名稱修正
            if (name === "未知區域") {
                if (props.OBJECTID === 26) {
                    return "梧棲區";
                } else if (props.OBJECTID === 28) {
                    return "臺中國際機場";
                }
            }
            return name;
        }

        // 8. 綁定事件監聽器至每個行政區
        function onEachFeature(feature, layer) {
            layer.on({
                mouseover: highlightFeature,
                mouseout: resetHighlight,
                click: zoomToFeature
            });

            const districtName = getDistrictName(feature.properties);
            layer.bindPopup(`<strong style="font-size:14px;">${districtName}</strong>`);
        }

        // 9. 右上角的即時動態資訊面板
        const info = L.control({ position: 'topright' });
        info.onAdd = function (map) {
            this._div = L.DomUtil.create('div', 'info-panel');
            this.update();
            return this._div;
        };
        info.update = function (props) {
            const name = props ? getDistrictName(props) : null;
            this._div.innerHTML = `<h4>臺中市行政區觀測</h4>` + 
                (props ? `<p>目前位置：<span class="highlight-text">${name}</span></p>` : `<p>請將滑鼠移至地圖各區</p>`);
        };
        info.addTo(map);

        // 10. 動態對 GeoJSON 資料結構進行遞迴座標轉換 (TWD97 轉 WGS84)
        function convertCoords(coords, type) {
            if (type === "Point") {
                return proj4(twd97, wgs84, coords);
            } else if (type === "LineString" || type === "MultiPoint") {
                return coords.map(p => proj4(twd97, wgs84, p));
            } else if (type === "Polygon" || type === "MultiLineString") {
                return coords.map(ring => ring.map(p => proj4(twd97, wgs84, p)));
            } else if (type === "MultiPolygon") {
                return coords.map(poly => poly.map(ring => ring.map(p => proj4(twd97, wgs84, p))));
            }
            return coords;
        }

        // 11. 遠端載入您指定的 GitHub 臺中市區界 JSON 網址
        const jsonUrl = 'https://s6351301-netizen.github.io/lee/json/TaichungCityBoundary_TWD97-1.json';

        fetch(jsonUrl)
            .then(response => {
                if (!response.ok) {
                    throw new Error('無法讀取網址圖資');
                }
                return response.json();
            })
            .then(data => {
                // 將所有特徵(Features)的 TWD97 平面座標，即時轉為 Leaflet 網頁專用的經緯度
                data.features.forEach(feature => {
                    if (feature.geometry && feature.geometry.coordinates) {
                        feature.geometry.coordinates = convertCoords(feature.geometry.coordinates, feature.geometry.type);
                    }
                });

                // 將轉換完畢的資料導入地圖
                geojsonLayer = L.geoJSON(data, {
                    style: defaultStyle,
                    onEachFeature: onEachFeature
                }).addTo(map);

                // 注意：這裡將原本結尾自動滿版縮放的 map.fitBounds 移除，
                // 以確保網頁開啟時能穩定維持在上方步驟 1 設定的大甲區視覺中心與特定縮放比例。
            })
            .catch(error => {
                console.error('圖資載入失敗：', error);
                alert('載入臺中市區界圖資失敗，請確認網路連線是否正常。');
            });
    </script>
</body>
</html>
