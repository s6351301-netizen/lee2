<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>臺中市宗親人員統計與線路導航</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: "Microsoft JhengHei", "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f4f4;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        
        /* 右上角整合動態資訊面板 */
        .info-panel {
            padding: 15px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            border-radius: 8px;
            border-left: 5px solid #1a73e8;
            width: 350px;
            max-height: 535px;
            overflow-y: auto;
            position: relative;
        }
        .info-panel h4 {
            margin: 0 0 8px 0;
            color: #333;
            font-size: 16px;
            border-bottom: 2px solid #ddd;
            padding-bottom: 5px;
        }
        
        /* 控制鈕與最小化文字樣式 */
        .panel-controls {
            position: absolute;
            top: 12px;
            right: 12px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }
        .panel-btn {
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            color: #aaa;
            user-select: none;
        }
        .panel-btn:hover {
            color: #e81123;
        }
        
        /* 最小化後的文字與符號一體化樣式 */
        .minimized-text {
            cursor: pointer;
            font-weight: bold;
            color: #333;
            font-size: 13px;
            padding: 2px 4px;
            user-select: none;
        }
        .minimized-text:hover {
            color: #1a73e8;
        }
        /* 讓最小化後的 + 號與 ➖ 減號完美一體化 */
        .minimized-plus {
            font-size: 14px;
            font-weight: bold;
            color: #aaa;
            margin-left: 3px;
        }
        .minimized-text:hover .minimized-plus {
            color: #1a73e8;
        }

        .info-panel p {
            margin: 0 0 8px 0;
            color: #666;
        }
        .highlight-text {
            color: #e81123;
            font-weight: bold;
            font-size: 18px;
        }

        /* 表格與名單樣式 */
        .stats-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 10px;
            font-size: 13px;
        }
        .stats-table th, .stats-table td {
            border: 1px solid #ccc;
            padding: 5px;
            text-align: center;
        }
        .stats-table th {
            background-color: #f8f9fa;
            font-weight: bold;
        }
        .name-list-section {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed #bbb;
            font-size: 13px;
            line-height: 1.4;
        }
        .gender-title {
            font-weight: bold;
            color: #333;
            margin: 4px 0;
        }
        .male-color { color: #0056b3; }
        .female-color { color: #b21f1f; }
        .name-string {
            color: #555;
            word-break: break-all;
        }

        /* 姓名超連結樣式 */
        .clickable-name {
            color: #1a73e8;
            text-decoration: underline;
            cursor: pointer;
            margin-right: 8px;
            display: inline-block;
        }
        .clickable-name:hover {
            color: #0d47a1;
            font-weight: bold;
        }

        /* 行政區超連結樣式 */
        .clickable-district {
            color: #1a73e8;
            text-decoration: underline;
            cursor: pointer;
        }
        .clickable-district:hover {
            color: #0d47a1;
            font-weight: bold;
        }

        /* 導航輸入框與推薦景點樣式 */
        .nav-input-group {
            margin-top: 10px;
            padding-top: 5px;
            font-size: 13px;
        }
        .nav-row {
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }
        .nav-row label {
            width: 100px;
            font-weight: bold;
            color: #444;
            font-size: 12px;
        }
        .nav-row input {
            flex: 1;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 12px;
            min-width: 0;
        }
        
        /* 推薦熱門景點核取方塊樣式 */
        .recommended-spots {
            margin: 6px 0;
            padding: 6px;
            background: #fdfdfd;
            border: 1px dashed #ccc;
            border-radius: 4px;
        }
        .spots-title {
            font-weight: bold;
            color: #555;
            margin-bottom: 4px;
            font-size: 12px;
        }
        .spots-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 10px;
        }
        .spot-item {
            display: flex;
            align-items: center;
            font-size: 11px;
            color: #333;
            cursor: pointer;
            user-select: none;
        }
        .spot-item input {
            margin-right: 3px;
            cursor: pointer;
        }

        .nav-btn-container {
            text-align: right;
            margin-top: 5px;
        }
        .go-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 5px 16px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        .go-btn:hover {
            background-color: #218838;
        }
        .verify-btn {
            background-color: #17a2b8;
            color: white;
            border: none;
            padding: 5px 8px;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 5px;
        }
        .verify-btn:hover {
            background-color: #138496;
        }

        /* 橫隔線與標題樣式 */
        .section-divider {
            border-top: 2px solid #ccc;
            margin: 12px 0 8px 0;
            padding-top: 8px;
        }
        .section-title {
            font-weight: bold;
            color: #6f42c1;
            font-size: 13px;
            margin-bottom: 8px;
        }

        /* 左上角總統計表面板 */
        .total-stats-panel {
            padding: 12px;
            font-size: 13px;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            border-top: 5px solid #6f42c1;
            width: 320px;
            max-height: 400px;
            overflow-y: auto;
            position: relative;
            margin-top: 10px;
        }
        .total-stats-panel h4 {
            margin: 0 0 8px 0;
            color: #222;
            font-size: 14px;
            text-align: center;
            border-bottom: 2px solid #ddd;
            padding-bottom: 5px;
        }
        .sub-title {
            font-weight: bold;
            margin: 10px 0 5px 0;
            color: #555;
            font-size: 12px;
        }
        
        /* 靈感來源完全透明與融合樣式 */
        .inspiration-panel {
            padding: 0px;
            background: transparent;
            box-shadow: none;
            border: none;
            width: auto;
            position: relative;
            margin-top: 0px;
            font-size: 12px;
        }
        .inspiration-panel p {
            margin: 0;
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: bold;
            color: #333;
            text-shadow: 1px 1px 1px rgba(255,255,255,0.8);
        }
        .inspiration-panel a {
            display: inline-flex;
            align-items: center;
        }
        .hint-text {
            font-size: 11px;
            color: #555;
            font-weight: normal;
            margin-left: 2px;
        }

        /* 滑鼠移過去顯示的區名文字樣式 */
        .custom-tooltip {
            background-color: rgba(0, 0, 0, 0.75) !important;
            border: none !important;
            border-radius: 4px !important;
            color: #fff !important;
            font-weight: bold !important;
            font-size: 13px !important;
            padding: 4px 8px !important;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3) !important;
        }

        /* 燈箱外觀樣式 */
        .custom-modal-backdrop {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .custom-modal-content {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            width: 420px;
            max-height: 85%;
            overflow-y: auto;
            box-shadow: 0 5px 25px rgba(0,0,0,0.3);
            font-family: "Microsoft JhengHei", Arial, sans-serif;
        }
        .custom-modal-content h3 {
            margin: 0 0 12px 0;
            color: #6f42c1;
            border-bottom: 2px solid #6f42c1;
            padding-bottom: 6px;
            font-size: 16px;
        }
        .modal-spots-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 15px;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ddd;
        }
        .modal-spot-item {
            display: flex;
            align-items: center;
            font-size: 12px;
            cursor: pointer;
        }
        .modal-spot-item input {
            margin-right: 4px;
        }
        .modal-people-section {
            border-top: 1px dashed #ccc;
            padding-top: 10px;
            margin-bottom: 15px;
        }
        .modal-people-title {
            font-weight: bold;
            font-size: 13px;
            color: #333;
            margin-bottom: 6px;
        }
        .modal-people-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            max-height: 150px;
            overflow-y: auto;
            background: #fff;
            padding: 5px;
        }
        .modal-person-item {
            display: flex;
            align-items: center;
            font-size: 12px;
            background: #eef2f7;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
        }
        .modal-person-item:hover {
            background: #d0e1fd;
        }
        .modal-person-item input {
            margin-right: 4px;
        }
        .modal-btn-group {
            display: flex;
            justify-content: right;
            gap: 10px;
        }
        .modal-btn {
            padding: 6px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }
        .modal-btn-confirm { background: #28a745; color: white; }
        .modal-btn-confirm:hover { background: #218838; }
        .modal-btn-cancel { background: #dc3545; color: white; }
        .modal-btn-cancel:hover { background: #bd2130; }

        /* 隱藏 Leaflet 原生導航文字說明 */
        .leaflet-routing-container, 
        .leaflet-routing-error,
        .leaflet-routing-alt {
            display: none !important;
        }

        /* 行動裝置防禦樣式 */
        @media (max-width: 767px) {
            .total-stats-panel {
                max-height: 200px;
                margin-top: 5px;
                margin-bottom: 5px;
            }
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.11.0/proj4.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

    <script>
        const twd97 = "+proj=tmerc +lat_0=0 +lon_0=121 +k=0.9999 +x_0=250000 +y_0=0 +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs";
        const wgs84 = "+proj=longlat +ellps=WGS84 +datum=WGS84 +no_defs";

        // 核心設定：畫面上顯示「李武略宗祠」，但底層對應此實體固定地址
        const targetTextName = "李武略宗祠";
        const targetFixedAddress = "臺中市大甲區義和里中山路一段484巷45號";

        const taichungDistricts = [
            "大甲區", "外埔區", "大安區", "日南區", "清水區", "沙鹿區", "梧棲區", "龍井區", 
            "太平區", "大里區", "霧峰區", "烏日區", "豐原區", "後里區", "石岡區", 
            "東勢區", "新社區", "潭子區", "大雅區", "神岡區", "大肚區", "和平區", 
            "中區", "東區", "南區", "西區", "北區", "西屯區", "南屯區", "北屯區"  
        ];

        const map = L.map('map').setView([24.182, 120.713], 11);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        let geojsonLayer;
        let taichungPeopleData = []; 
        let routingControl = null;   
        let lastClickedPerson = { name: "", address: "" }; 

        let isObservationPanelMinimized = false;
        let isTotalStatsPanelMinimized = false;
        
        let currentObservationProps = null;
        let currentObservationIndex = undefined;
        let currentObservationFeature = null;

        // 暫存數據
        let savedSrcLocation = "";
        let savedTargetLocation = targetTextName; // 畫面上內建維持顯示 "李武略宗祠" 
        let savedExchangeSrc = "";
        let savedExchangeTarget = "";

        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;

        // 🛡️ LINE 外部瀏覽器智慧攔截函數
        function triggerLineExternalBrowser() {
            if (isMobile) {
                const hasParam = window.location.search.indexOf('openExternalBrowser=1') !== -1;
                if (!hasParam) {
                    const currentUrl = window.location.href;
                    const separator = currentUrl.indexOf('?') !== -1 ? '&' : '?';
                    window.location.href = currentUrl + separator + "openExternalBrowser=1";
                    return true; // 攔截成功，準備重載跳轉
                }
            }
            return false;
        }

        function detectDistrictFromAddress(address) {
            if (!address) return "未知區";
            if (address.includes("日南")) return "日南區";
            for (let dist of taichungDistricts) {
                const shortName = dist.replace('區', '');
                if (address.includes(shortName)) return dist;
            }
            return "未知區";
        }

        function filterByDistrict(peopleList, districtName) {
            return peopleList.filter(p => {
                if (!p.address) return false;
                const cleanAddress = p.address;
                const shortName = districtName.replace('區', '');

                if (districtName === "日南區") return cleanAddress.includes("日南");
                if (districtName === "集中區") return false; 
                if (districtName === "中區") {
                    return cleanAddress.includes("開區") || cleanAddress.includes("集中區") || cleanAddress.includes("台中市中") || cleanAddress.includes("臺中市中");
                }
                if ((shortName === "西" || shortName === "南" || shortName === "北" || shortName === "東") && cleanAddress.includes("大甲")) {
                    return false;
                }
                return cleanAddress.includes(shortName);
            });
        }

        function defaultStyle(feature) {
            return { fillColor: '#3a7bd5', weight: 2, opacity: 1, color: '#ffffff', fillOpacity: 0.35 };
        }

        function highlightFeature(e) {
            const layer = e.target;
            layer.setStyle({ fillColor: '#48d1cc', weight: 4, color: '#4a4a4a', fillOpacity: 0.2 });
            if (!L.Browser.ie && !L.Browser.opera && !L.Browser.edge) layer.bringToFront();
        }

        function resetHighlight(e) { geojsonLayer.resetStyle(e.target); }

        function onFeatureClick(e) {
            map.fitBounds(e.target.getBounds());
            
            // 點擊區域時，如果線路導航目前是最小化狀態，將其展開
            if (isObservationPanelMinimized) {
                info.toggleMinimize();
            }
            
            info.update(e.target.feature.properties, e.target.feature._geoIndex, e.target.feature);
        }

        function getDistrictName(props, geoIndex, feature) {
            let name = "未知區域";
            if (props) name = props.區名 || props.TOWNNAME || "未知區域";
            if (geoIndex === 25) name = "梧棲區";
            if (geoIndex === 27) name = "龍井區";

            if (feature && turf.getType(feature)) {
                try {
                    const centroid = turf.centroid(feature);
                    const lng = centroid.geometry.coordinates[0];
                    if (name === "梧棲區" && lng > 120.75) return "新社區";
                } catch (err) {
                    console.error("空間質心計算錯誤: ", err);
                }
            }
            return name;
        }

        function onEachFeature(feature, layer) {
            const districtName = getDistrictName(feature.properties, feature._geoIndex, feature);
            layer.bindTooltip(districtName, { sticky: true, direction: 'auto', className: 'custom-tooltip' });
            layer.on({ mouseover: highlightFeature, mouseout: resetHighlight, click: onFeatureClick });
            layer.bindPopup(`<strong style="font-size:14px;">${districtName}</strong>`);
        }

        window.saveInputValue = function(id, val) {
            if (id === 'srcLocation') savedSrcLocation = val;
            if (id === 'targetLocation') savedTargetLocation = val;
            if (id === 'exchangeSrc') savedExchangeSrc = val;
            if (id === 'exchangeTarget') savedExchangeTarget = val;
        };

        // --- 🚀 Google 地圖外連導航跳轉處理 🚀 ---
        function openGoogleMapsWindow(originAddr, destAddr) {
            let cleanOrigin = originAddr.replace(/\(.*?\)/g, "").trim();
            let cleanDest = destAddr.replace(/\(.*?\)/g, "").trim();
            
            // 如果目的地文字是內建的 "李武略宗祠"，底層傳送給 Google 地圖時替換成固定地址
            if (cleanDest === targetTextName) {
                cleanDest = targetFixedAddress;
            }
            if (cleanOrigin === targetTextName) {
                cleanOrigin = targetFixedAddress;
            }
            
            const googleNavUrl = `https://www.google.com.tw/maps/dir/${encodeURIComponent(cleanOrigin)}/${encodeURIComponent(cleanDest)}`;
            window.open(googleNavUrl, "_blank", "width=1000,height=750,toolbar=yes,location=yes,status=yes,menubar=yes,scrollbars=yes,resizable=yes");
        }

        window.handleNameClick = function(encodedAddr, encodedName) {
            // 被動攔截：只有點擊姓名時，手機在 LINE 內才會跳出 Chrome
            if (triggerLineExternalBrowser()) {
                return;
            }

            const address = decodeURIComponent(encodedAddr);
            const name = decodeURIComponent(encodedName);
            lastClickedPerson = { name: name, address: address };
            
            const distName = detectDistrictFromAddress(address);
            savedSrcLocation = `${name}(${distName})`;

            const srcInput = document.getElementById("srcLocation");
            if (srcInput) srcInput.value = savedSrcLocation;

            // 保持畫面上目的地文字不變
            const targetInputVal = document.getElementById("targetLocation") ? document.getElementById("targetLocation").value : savedTargetLocation;
            
            getLatLngByAddress(address, function(srcLat, srcLng) {
                getLatLngByAddress(targetInputVal, function(destLat, destLng) {
                    drawCleanRoute(srcLat, srcLng, destLat, destLng);
                });
            });

            // 點擊姓名，啟動導航至「李武略宗祠」（底層會自動代入實體固定地址）
            openGoogleMapsWindow(address, targetTextName);
        };

        window.handleDistrictClick = function(districtName) {
            if (!geojsonLayer) return;
            let targetLayer = null;
            geojsonLayer.eachLayer(function(layer) {
                geojsonLayer.resetStyle(layer);
                layer.closeTooltip(); 
                const name = getDistrictName(layer.feature.properties, layer.feature._geoIndex, layer.feature);
                if (name === districtName) targetLayer = layer;
            });

            if (targetLayer) {
                map.fitBounds(targetLayer.getBounds());
                
                // 從總表點擊行政區時，如果線路導航目前是最小化狀態，也將其展開
                if (isObservationPanelMinimized) {
                    info.toggleMinimize();
                }

                info.update(targetLayer.feature.properties, targetLayer.feature._geoIndex, targetLayer.feature);
                targetLayer.setStyle({ fillColor: '#48d1cc', weight: 4, color: '#4a4a4a', fillOpacity: 0.2 });
                if (!L.Browser.ie && !L.Browser.opera && !L.Browser.edge) layer.bringToFront();
                targetLayer.openTooltip(targetLayer.getBounds().getCenter());
            }
        };

        window.updateTargetFromCheckbox = function() {
            const checkedBoxes = document.querySelectorAll('.spot-checkbox:checked');
            const targetInput = document.getElementById('targetLocation');
            const selectedSpots = Array.from(checkedBoxes).map(cb => cb.value);
            savedTargetLocation = selectedSpots.length > 0 ? selectedSpots.join('，') : targetTextName;
            if (targetInput) targetInput.value = savedTargetLocation;
        };

        window.queryPersonByDistrictPopup = function(inputId) {
            const backdrop = document.createElement('div');
            backdrop.className = 'custom-modal-backdrop';
            backdrop.id = 'customModal';

            let activeDistricts = taichungDistricts.filter(d => filterByDistrict(taichungPeopleData, d).length > 0);

            let districtsHtml = activeDistricts.map(dist => `
                <label class="modal-spot-item">
                    <input type="radio" name="modalDist" value="${dist}" onclick="window.loadModalPeopleList('${dist}')">
                    ${dist}
                </label>
            `).join('');

            backdrop.innerHTML = `
                <div class="custom-content custom-modal-content">
                    <h3>🔍 宗親人員智慧查詢選單</h3>
                    <div style="font-size:12px; margin-bottom:6px; font-weight:bold; color:#555;">1. 請勾選行政區別：</div>
                    <div class="modal-spots-grid">
                        ${districtsHtml}
                    </div>
                    <div class="modal-people-section">
                        <div class="modal-people-title">2. 請選擇對應的宗親姓名：</div>
                        <div class="modal-people-grid" id="modalPeopleGrid">
                            <span style="color:#aaa; font-size:12px; font-style:italic;">請先勾選上方行政區...</span>
                        </div>
                    </div>
                    <div class="modal-btn-group">
                        <button class="modal-btn modal-btn-cancel" onclick="document.getElementById('customModal').remove()">取消</button>

        window.loadModalPeopleList = function(districtName) {
            const grid = document.getElementById('modalPeopleGrid');
            if (!grid) return;

            const filtered = filterByDistrict(taichungPeopleData, districtName);
            if (filtered.length === 0) {
                grid.innerHTML = `<span style="color:#dc3545; font-size:12px;">該區目前無宗親資料</span>`;

            }

            grid.innerHTML = filtered.map(p => `
                <label class="modal-person-item">
                    <input type="radio" name="modalPerson" value="${p.name}" data-dist="${districtName}">
                    ${p.name}
                </label>
            `).join('');
        };

        window.confirmModalSelection = function(inputId) {
            const selectedPersonRadio = document.querySelector('input[name="modalPerson"]:checked');
            if (!selectedPersonRadio) {
                alert("請選取一位宗親姓名後再按確認！");
                return;
            }

            const name = selectedPersonRadio.value;
            const dist = selectedPersonRadio.getAttribute('data-dist');
            const finalValue = `${name}(${dist})`;

            const inputEl = document.getElementById(inputId);
            if (inputEl) {
                inputEl.value = finalValue;
                window.saveInputValue(inputId, finalValue);

            document.getElementById('customModal').remove();

        const inspirationPanel = L.control({ position: 'topleft' });
        inspirationPanel.onAdd = function (map) {
            this._div = L.DomUtil.create('div', 'inspiration-panel');
            this._div.innerHTML = `
                <p>靈感來源
                    <a href="https://www.lib.ncku.edu.tw/search/heritage/pdf/A10102.pdf" target="_blank">
                        <img src="https://market.cloud.edu.tw/images/file/pdf.png" width="17" height="17">
                    </a><span class="hint-text">點擊PDF圖片看文章</span>
                </p>`;
            L.DomEvent.disableClickPropagation(this._div);
            return this._div;
        };
        inspirationPanel.addTo(map);

        const info = L.control({ position: 'topright' });
        info.onAdd = function (map) {
            this._div = L.DomUtil.create('div', 'info-panel');
            this._div.id = 'observation-panel-window';
            this.update();
            return this._div;
        };
        
        info.toggleMinimize = function() {
            isObservationPanelMinimized = !isObservationPanelMinimized;
            this.update(currentObservationProps, currentObservationIndex, currentObservationFeature);
        };

        info.update = function (props, geoIndex, feature) {
            if(props !== undefined || geoIndex !== undefined || feature !== undefined) {
                currentObservationProps = props;
                currentObservationIndex = geoIndex;
                currentObservationFeature = feature;
            }

            const districtName = currentObservationProps || currentObservationIndex !== undefined ? getDistrictName(currentObservationProps, currentObservationIndex, currentObservationFeature) : null;
            
            if (isObservationPanelMinimized) {
                this._div.innerHTML = `<div class="minimized-text" onclick="info.toggleMinimize()">線路導航<span class="minimized-plus">+</span></div>`;
                this._div.style.padding = "6px 12px";
                this._div.style.width = "auto";
                return;
            }

            this._div.style.padding = "15px";
            this._div.style.width = "350px";

            const defaultNavHtml = `
                <div class="nav-input-group">
                    <div class="nav-row">
                        <label>來源地址：</label>
                        <input type="text" id="srcLocation" value="${savedSrcLocation}" oninput="window.saveInputValue('srcLocation', this.value)" placeholder="點擊人名自動帶入">
                    </div>
                    <div class="nav-row">
                        <label>目標地址：</label>
                        <input type="text" id="targetLocation" value="${savedTargetLocation}" oninput="window.saveInputValue('targetLocation', this.value)">
                    </div>
                    <div class="recommended-spots">
                        <div class="spots-title">🌟 台中熱門景點推薦：</div>
                        <div class="spots-grid">
                            <label class="spot-item"><input type="checkbox" value="高美濕地" class="spot-checkbox" onclick="window.updateTargetFromCheckbox()">高美濕地</label>
                            <label class="spot-item"><input type="checkbox" value="逢甲夜市" class="spot-checkbox" onclick="window.updateTargetFromCheckbox()">逢甲夜市</label>
                            <label class="spot-item"><input type="checkbox" value="國立自然科學博物館" class="spot-checkbox" onclick="window.updateTargetFromCheckbox()">科博館</label>
                            <label class="spot-item"><input type="checkbox" value="台中歌劇院" class="spot-checkbox" onclick="window.updateTargetFromCheckbox()">歌劇院</label>
                            <label class="spot-item"><input type="checkbox" value="宮原眼科" class="spot-checkbox" onclick="window.updateTargetFromCheckbox()">宮原眼科</label>
                            <label class="spot-item"><input type="checkbox" value="台中火車站" class="spot-checkbox" onclick="window.updateTargetFromCheckbox()">台中火車站</label>
                            <label class="spot-item"><input type="checkbox" value="台中地方法院" class="spot-checkbox" onclick="window.updateTargetFromCheckbox()">台中地方法院</label>
                            <label class="spot-item"><input type="checkbox" value="大甲火車站" class="spot-checkbox" onclick="window.updateTargetFromCheckbox()">大甲火車站</label>
                        </div>
                    </div>
                    <div class="nav-btn-container">
                        <button class="go-btn" onclick="planRouteFromPersonToTarget()">送出</button>
                    </div>

                    <div class="section-divider"></div>
                    <div class="section-title">💬 宗親與宗親交流</div>
                    <div class="nav-row">
                        <label>A.來源地址：</label>
                        <input type="text" id="exchangeSrc" value="${savedExchangeSrc}" oninput="window.saveInputValue('exchangeSrc', this.value)" placeholder="點擊查詢按鈕選取">
                        <button class="verify-btn" onclick="window.queryPersonByDistrictPopup('exchangeSrc')">查詢</button>
                    </div>
                    <div class="nav-row">
                        <label>B.目標地址：</label>
                        <input type="text" id="exchangeTarget" value="${savedExchangeTarget}" oninput="window.saveInputValue('exchangeTarget', this.value)" placeholder="點擊查詢按鈕選取">
                        <button class="verify-btn" onclick="window.queryPersonByDistrictPopup('exchangeTarget')">查詢</button>
                    </div>
                    <div class="nav-btn-container">
                        <button class="go-btn" style="background-color:#6f42c1;" onclick="planExchangeRoute()">送出</button>
                    </div>
                </div>
            `;

            if (!districtName || districtName === "未知區域") {
                this._div.innerHTML = `
                    <div class="panel-controls"><span class="panel-btn" onclick="info.toggleMinimize()">➖</span></div>
                    <h4>臺中市宗親人員統計與線路導航</h4>
                    <p style="margin:5px 0 0 0; color:#e81123; font-weight:bold;">請點擊地圖各區或總統計表查看宗親名單</p>
                    ${defaultNavHtml}
                `;
                return;
            }

            const distPeople = filterByDistrict(taichungPeopleData, districtName);
            const males = distPeople.filter(p => p.gender === '男' || p.gender === '男性');
            const females = distPeople.filter(p => p.gender === '女' || p.gender === '女性');
            
            const generateNameLinks = (peopleArray) => {
                if (peopleArray.length === 0) return '無';
                return peopleArray.map(p => {
                    const encAddr = encodeURIComponent(p.address);
                    const encName = encodeURIComponent(p.name);
                    return `<span class="clickable-name" onclick="window.handleNameClick('${encAddr}', '${encName}')">${p.name}</span>`;
                }).join('，');
            };

            // 保持表格與導航完全獨立，不進行任何合併
            this._div.innerHTML = `
                <div class="panel-controls"><span class="panel-btn" onclick="info.toggleMinimize()">➖</span></div>
                <h4>臺中市宗親人員統計與線路導航</h4>
                <p>目前鎖定：<span class="highlight-text">${districtName}</span></p>
                <p style="font-size:12px; color:#1a73e8; margin-top:-5px;">💡 提示：點擊藍色人名，即可啟動路徑導航</p>
                
                <table class="stats-table">
                    <thead><tr><th>男性</th><th>女性</th><th>合計</th></tr></thead>
                    <tbody><tr><td>${males.length} 人</td><td>${females.length} 人</td><td style="font-weight:bold; color:#e81123;">${distPeople.length} 人</td></tr></tbody>
                </table>
                
                <div class="name-list-section">
                    <div class="gender-title male-color">👨 男性名單 (${males.length}人)：</div>
                    <div class="name-string">${generateNameLinks(males)}</div>
                </div>
                <div class="name-list-section">
                    <div class="gender-title female-color">👩 女性名單 (${females.length}人)：</div>
                    <div class="name-string">${generateNameLinks(females)}</div>
                </div>
                ${defaultNavHtml}
            `;
            
            L.DomEvent.disableClickPropagation(this._div);
            L.DomEvent.disableScrollPropagation(this._div);
        };
        info.addTo(map);

        const totalStatsPanel = L.control({ position: isMobile ? 'bottomleft' : 'topleft' });
        totalStatsPanel.onAdd = function (map) {
            this._div = L.DomUtil.create('div', 'total-stats-panel');
            this._div.id = 'total-stats-window';
            this.update();
            return this._div;
        };

        totalStatsPanel.toggleMinimize = function() {
            isTotalStatsPanelMinimized = !isTotalStatsPanelMinimized;
            this.update();
        };

        totalStatsPanel.update = function () {
            if (isTotalStatsPanelMinimized) {
                this._div.innerHTML = `<div class="minimized-text" onclick="totalStatsPanel.toggleMinimize()">統計表<span class="minimized-plus">+</span></div>`;
                this._div.style.padding = "6px 12px";
                this._div.style.width = "auto";
                return;
            }

            this._div.style.padding = "12px";
            this._div.style.width = "320px";

            if (taichungPeopleData.length === 0) {
                this._div.innerHTML = `<h4>台中市宗親總統計表</h4><p>資料載入中...</p>`;
                return;
            }

            const totalMales = taichungPeopleData.filter(p => p.gender === '男' || p.gender === '男性').length;
            const totalFemales = taichungPeopleData.filter(p => p.gender === '女' || p.gender === '女性').length;
            const totalCount = taichungPeopleData.length;

            let districtRowsHtml = '';
            taichungDistricts.forEach(dist => {
                const distPeople = filterByDistrict(taichungPeopleData, dist);
                const dMales = distPeople.filter(p => p.gender === '男' || p.gender === '男性').length;
                const dFemales = distPeople.filter(p => p.gender === '女' || p.gender === '女性').length;
                const dTotal = distPeople.length;
                const percentage = totalCount > 0 ? ((dTotal / totalCount) * 100).toFixed(2) : "0.00";
                
                districtRowsHtml += `
                    <tr>
                        <td><span class="clickable-district" onclick="window.handleDistrictClick('${dist}')">${dist}</span></td>
                        <td>${dMales}</td>
                        <td>${dFemales}</td>
                        <td style="font-weight:bold; color:#e81123;">${dTotal}</td>
                        <td style="color:#28a745;">${percentage}%</td>
                    </tr>
                `;
            });

            this._div.innerHTML = `
                <div class="panel-controls"><span class="panel-btn" onclick="totalStatsPanel.toggleMinimize()">➖</span></div>
                <h4>台中市宗親總統計表</h4>
                <div class="sub-title">📊 全市總計人數</div>
                <table class="stats-table">
                    <thead><tr><th>總男性</th><th>總女性</th><th>台中總計</th></tr></thead>
                    <tbody><tr><td>${totalMales} 人</td><td>${totalFemales} 人</td><td style="font-weight:bold; color:#6f42c1;">${totalCount} 人</td></tr></tbody>
                </table>
                <div class="sub-title">🏘️ 各行政區人口一覽</div>
                <table class="stats-table" style="font-size: 11px;">
                    <thead><tr style="background-color:#eef2f7;"><th>行政區</th><th>男</th><th>女</th><th>總計</th><th>比例</th></tr></thead>
                    <tbody>${districtRowsHtml}</tbody>
                </table>
            `;
            
            L.DomEvent.disableClickPropagation(this._div);
            L.DomEvent.disableScrollPropagation(this._div);
        };
        totalStatsPanel.addTo(map);

        // 🛡️ 核心修正：偵測到手機版時，預設將「統計表」與「線路導航」都最小化
        if (isMobile) {
            //totalStatsPanel.toggleMinimize();  //統計表格,手機版,第一次打開網頁時,要將路導航表格最大化.
            info.toggleMinimize();  //線路導航表格,手機版第一次打開網頁時,要將路導航表格最大化.
        }

        function getLatLngByAddress(address, callback) {
            if(!address) return;
            let cleanAddr = address.replace("台中市", "").replace("臺中市", "").trim();
            
            // 【底層解析連動】：只要輸入框文字包含「李武略宗祠」，一律靜態對應固定實體坐標
            if (cleanAddr.includes(targetTextName) || cleanAddr === targetFixedAddress) {
                callback(24.33774, 120.61888);
                return;
            }
            if (cleanAddr === "台中火車站" || cleanAddr === "臺中火車站") { callback(24.1372, 120.6866); return; }
            if (cleanAddr === "台中地方法院" || cleanAddr === "臺中地方法院") { callback(24.1374, 120.6774); return; }
            if (cleanAddr === "大甲火車站") { callback(24.3446, 120.6247); return; }

            function fetchAddress(searchAddr, isRetry = false) {
                const geocodeUrl = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent("台中市" + searchAddr)}&limit=1`;
                fetch(geocodeUrl)
                    .then(res => res.json())
                    .then(geoResult => {
                        if (geoResult.length === 0 && !isRetry) {
                            const fuzzyAddress = searchAddr.replace(/\d+([號樓-].*)?$/, '');
                            fetchAddress(fuzzyAddress, true);
                            return;
                        }
                        if (geoResult.length === 0) {
                            alert(`無法解析地址：${cleanAddr}`);
                            return;
                        }
                        callback(parseFloat(geoResult[0].lat), parseFloat(geoResult[0].lon));
                    })
                    .catch(err => { alert(`解析地址出錯：${err.message}`); });
            }
            fetchAddress(cleanAddr);
        }

        function drawCleanRoute(startLat, startLng, endLat, endLng) {
            if (routingControl) map.removeControl(routingControl);
            routingControl = L.Routing.control({
                waypoints: [L.latLng(startLat, startLng), L.latLng(endLat, endLng)],
                addWaypoints: false,
                fitSelectedRoutes: true,
                createMarker: function() { return null; },
                lineStyle: { styles: [{ color: '#e81123', opacity: 0.8, weight: 5 }] }
            }).addTo(map);
        }

        window.planRouteFromPersonToTarget = function() {
            // 被動攔截：只有在按下送出按鈕時，手機在 LINE 內才會跳出 Chrome
            if (triggerLineExternalBrowser()) {
                return;
            }

            let startAddress = savedSrcLocation;
            let finalGoogleOrigin = savedSrcLocation; 

            if (startAddress.includes("(")) {
                const pureName = startAddress.replace(/\(.*?\)/g, "").trim();
                const matched = taichungPeopleData.find(p => p.name === pureName);
                if (matched) {
                    startAddress = matched.address;
                    finalGoogleOrigin = matched.address; 
                }
            }

            if (!startAddress) {
                alert("請先在名單中點擊任一宗親的名字，或手動輸入出發起點！");
                return;
            }
            if (!savedTargetLocation) {
                alert("請輸入或勾選目標地點名稱！");
                return;
            }
            
            getLatLngByAddress(startAddress, function(srcLat, srcLng) {
                getLatLngByAddress(savedTargetLocation, function(destLat, destLng) {
                    drawCleanRoute(srcLat, srcLng, destLat, destLng);
                });
            });

            // 送出導航（openGoogleMapsWindow 底層會把 "李武略宗祠" 悄悄轉成實體地址傳給 Google）
            openGoogleMapsWindow(finalGoogleOrigin, savedTargetLocation);
        };

        window.planExchangeRoute = function() {
            // 被動攔截：只有在按下交流路線送出按鈕時，手機在 LINE 內才會跳出 Chrome
            if (triggerLineExternalBrowser()) {
                return;
            }

            let srcName = savedExchangeSrc.replace(/\(.*?\)/g, "").trim();
            let targetName = savedExchangeTarget.replace(/\(.*?\)/g, "").trim();

            if (!srcName || !targetName) {
                alert("請確保 A.來源地址 與 B.目標地址 皆已透過「查詢」按鈕選取成功！");
                return;
            }

            const pStart = taichungPeopleData.find(p => p.name === srcName);
            const pEnd = taichungPeopleData.find(p => p.name === targetName);

            if (!pStart || !pEnd) {
                alert("起點或終點姓名有誤，請點選「查詢」重新選取核對！");
                return;
            }

            getLatLngByAddress(pStart.address, function(srcLat, srcLng) {
                getLatLngByAddress(pEnd.address, function(destLat, destLng) {
                    drawCleanRoute(srcLat, srcLng, destLat, destLng);
                });
            });

            openGoogleMapsWindow(pStart.address, pEnd.address);
        };

        function convertCoords(coords, type) {
            if (type === "Point") return proj4(twd97, wgs84, coords);
            if (type === "LineString" || type === "MultiPoint") return coords.map(p => proj4(twd97, wgs84, p));
            if (type === "Polygon" || type === "MultiLineString") return coords.map(ring => ring.map(p => proj4(twd97, wgs84, p)));
            if (type === "MultiPolygon") return coords.map(poly => poly.map(ring => ring.map(p => proj4(twd97, wgs84, p))));
            return coords;
        }

        const jsonUrl = 'https://s6351301-netizen.github.io/lee/json/TaichungCityBoundary_TWD97-1.json';
        const dataUrl = 'https://s6351301-netizen.github.io/lee/json/data2.json';

        fetch(dataUrl)
            .then(res => res.json())
            .then(database => {
                taichungPeopleData = database.map(item => {
                    let rawName = item.name || "未知";
                    let rawAddr = item.address || "";
                    if (rawName.includes("區") || rawName.includes("路") || rawName.includes("'") || rawName.includes(" planRoute")) {
                        const match = rawName.match(/[\u4e00-\u9fa5]{2,4}/);
                        rawName = match ? match[0] : "未知";
                    }
                    if (rawAddr.includes("';") || rawAddr.includes("\";") || rawAddr.includes("}")) {
                        rawAddr = rawAddr.split("';")[0].split('";')[0].split('}')[0];
                    }
                    rawAddr = rawAddr.replace(/<[^>]*>/g, "");
                    return { name: rawName.trim(), gender: item.gender || "男", address: rawAddr.trim() };
                }).filter(item => item.address.includes("台中") || item.address.includes("臺中"));
                
                totalStatsPanel.update();
                return fetch(jsonUrl);
            })
            .then(response => response.json())
            .then(data => {
                data.features.forEach((feature, index) => {
                    feature._geoIndex = index;
                    if (feature.geometry && feature.geometry.coordinates) {
                        feature.geometry.coordinates = convertCoords(feature.geometry.coordinates, feature.geometry.type);
                    }
                    if (index === 25 && turf.getType(feature)) {
                        if(!feature.properties) feature.properties = {};
                        feature.properties.區名 = "梧棲區";
                    }
                    if (index === 27 && turf.getType(feature)) {
                        if(!feature.properties) feature.properties = {};
                        feature.properties.區名 = "龍井區";
                    }
                });

                geojsonLayer = L.geoJSON(data, { style: defaultStyle, onEachFeature: onEachFeature }).addTo(map);
            })
            .catch(error => { console.error('初始化失敗：', error); });
    </script>
