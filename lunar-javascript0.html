<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>台灣萬年曆黃曆</title>
    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript/lunar.min.js"></script>
    <style>
        :root { --primary-color: #A82024; --bg-color: #FDFBF7; --text-dark: #2B2B2B; --border-color: #E6DFD3; }
        body { background-color: var(--bg-color); color: var(--text-dark); padding: 20px; font-family: "Microsoft JhengHei", sans-serif; }
        header { text-align: center; margin-bottom: 25px; }
        .info-header { font-size: 18px; font-weight: bold; margin-bottom: 20px; }
        select { font-size: 18px; font-weight: bold; border: none; background: transparent; cursor: pointer; }
        
        .calendar-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; max-width: 1200px; margin: 0 auto; }
        .month-box { background: #fff; border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; }
        .month-title { text-align: center; font-weight: bold; border-bottom: 2px solid var(--primary-color); margin-bottom: 5px; padding-bottom: 5px; }
        
        .week-header { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 0.8rem; color: #888; margin-bottom: 5px; }
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; }
        
        .day-cell { height: 75px; border: 0.5px solid #f9f9f9; padding-top: 5px; font-size: 0.8rem; overflow: hidden; }
        /* 修改此處：新增 font-weight: bold */
        .holiday-bg { background-color: #ffcdd2 !important; font-weight: bold; } 
        .weekend-bg { background-color: #e3f2fd !important; }
        
        .solar-num { font-weight: bold; font-size: 0.9rem; }
        .lunar-txt { font-size: 0.75rem; color: #555; }
        .extra-txt { font-size: 0.65rem; color: #888; margin-top: 2px; white-space: nowrap; overflow: hidden; cursor: default; }
        
        footer { margin-top: 40px; max-width: 900px; margin: 40px auto; border-top: 2px solid #ccc; padding-top: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
    </style>
</head>
<body>

<header>
    <h1>台灣萬年曆黃曆</h1>
    <div class="info-header">
        <select id="year-picker"></select>
        <span id="year-text"></span>
    </div>
</header>

<div class="calendar-container" id="calendar-grid"></div>

<footer id="holiday-footer">
    <h2>年度紀念日與休假日列表</h2>
    <table id="holiday-table">
        <thead><tr><th>日期區間</th><th>節日名稱</th><th>合計天數</th></tr></thead>
        <tbody></tbody>
    </table>
</footer>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const yearPicker = document.getElementById('year-picker');
        const calendarGrid = document.getElementById('calendar-grid');
        const yearText = document.getElementById('year-text');
        const tbody = document.querySelector('#holiday-table tbody');
        
        const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
        
        function getWeekDay(dateStr) {
            const d = new Date(dateStr);
            return weekDays[d.getDay()];
        }
        
        const HOLIDAYS_2026 = [
            { start: "2026-01-01", end: "2026-01-01", name: "開國日", days: 1 },
            { start: "2026-02-17", end: "2026-02-17", name: "除夕", days: 1 },
            { start: "2026-02-18", end: "2026-02-20", name: "春節", days: 3 },
            { start: "2026-02-28", end: "2026-02-28", name: "和平日", days: 1 },
            { start: "2026-04-04", end: "2026-04-05", name: "兒童清明", days: 2 },
            { start: "2026-05-01", end: "2026-05-01", name: "勞動節", days: 1 },
            { start: "2026-06-19", end: "2026-06-19", name: "端午節", days: 1 },
            { start: "2026-09-25", end: "2026-09-25", name: "中秋節", days: 1 },
            { start: "2026-10-10", end: "2026-10-10", name: "國慶日", days: 1 }
        ];

        for (let y = 2020; y <= 2055; y++) {
            const opt = document.createElement('option');
            opt.value = y;
            opt.innerText = `${y} 年 (民國 ${y - 1911} 年)`;
            if (y === 2026) opt.selected = true;
            yearPicker.appendChild(opt);
        }

        function renderCalendar(targetYear) {
            calendarGrid.innerHTML = '';
            tbody.innerHTML = '';
            const year = parseInt(targetYear);
            const firstDay = Lunar.fromYmd(year, 1, 1);
            yearText.innerText = ` 歲次 ${firstDay.getYearInGanZhi()}(${firstDay.getYearShengXiao().replace('马', '馬')})年`;

            HOLIDAYS_2026.forEach(h => {
                let dateRange = "";
                if (h.start === h.end) {
                    dateRange = `${h.start}(${getWeekDay(h.start)})`;
                } else {
                    dateRange = `${h.start}(${getWeekDay(h.start)}) ~ ${h.end}(${getWeekDay(h.end)})`;
                }
                tbody.innerHTML += `<tr><td>${dateRange}</td><td>${h.name}</td><td>${h.days} 天</td></tr>`;
            });

            for (let m = 1; m <= 12; m++) {
                const monthBox = document.createElement('div');
                monthBox.className = 'month-box';
                monthBox.innerHTML = `<div class="month-title">${m} 月</div><div class="week-header"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div>`;
                const daysGrid = document.createElement('div');
                daysGrid.className = 'days-grid';
                const firstDateObj = new Date(year, m - 1, 1);
                const lastDateObj = new Date(year, m, 0);
                
                for (let i = 0; i < firstDateObj.getDay(); i++) daysGrid.appendChild(document.createElement('div'));
                
                for (let d = 1; d <= lastDateObj.getDate(); d++) {
                    const dateObj = new Date(year, m - 1, d);
                    const ymd = `${year}-${m.toString().padStart(2,'0')}-${d.toString().padStart(2,'0')}`;
                    const holidayInfo = HOLIDAYS_2026.find(h => ymd >= h.start && ymd <= h.end);
                    const isHoliday = !!holidayInfo;
                    
                    const lunarDay = Solar.fromYmd(year, m, d).getLunar();
                    const yiList = lunarDay.getDayYi();
                    const displayText = yiList.length > 0 ? '宜' + yiList.slice(0, 1).join('') : '宜諸事吉';
                    
                    const cell = document.createElement('div');
                    cell.className = `day-cell ${isHoliday ? 'holiday-bg' : (dateObj.getDay() === 0 || dateObj.getDay() === 6 ? 'weekend-bg' : '')}`;
                    cell.innerHTML = `
                        <div class="solar-num">${d}</div>
                        <div class="lunar-txt">${lunarDay.getDayInChinese()}</div>
                        <div class="extra-txt">${isHoliday ? holidayInfo.name : displayText}</div>
                    `;
                    daysGrid.appendChild(cell);
                }
                monthBox.appendChild(daysGrid);
                calendarGrid.appendChild(monthBox);
            }
        }

        yearPicker.addEventListener('change', (e) => renderCalendar(e.target.value));
        renderCalendar(2026);
    });
</script>
</body>
</html>
